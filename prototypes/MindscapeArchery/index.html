<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>심상 활쏘기 · 배경 선택</title>
  <style>

:root {
  font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: #33363d;
  background: #f5f6f8;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #f5f6f8;
}

button { font: inherit; }

#app {
  position: relative;
  width: min(100vw, 520px);
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  background: #fff;
}

#gameCanvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.icon-button {
  position: absolute;
  top: calc(15px + env(safe-area-inset-top));
  left: 15px;
  width: 49px;
  height: 49px;
  border: 1px solid rgba(87, 92, 104, 0.08);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.78);
  box-shadow: 0 10px 28px rgba(98, 105, 122, 0.10);
  backdrop-filter: blur(14px);
  display: grid;
  place-content: center;
  gap: 4px;
  z-index: 15;
  cursor: pointer;
}

.icon-button span {
  display: block;
  width: 18px;
  height: 1.5px;
  border-radius: 9px;
  background: #4d5159;
}

#hud {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  left: 50%;
  width: min(62%, 245px);
  min-height: 54px;
  padding: 9px 14px 8px;
  transform: translateX(-50%);
  border: 1px solid rgba(115, 121, 137, 0.07);
  border-radius: 24px;
  color: #41454d;
  background: rgba(255, 255, 255, 0.72);
  box-shadow: 0 10px 30px rgba(109, 116, 134, 0.08);
  backdrop-filter: blur(14px);
  font-weight: 650;
  font-size: 11px;
  z-index: 10;
}

.hud-top,
.hud-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.hud-top { margin-bottom: 6px; }
#stageText { color: #575c67; font-size: 11px; letter-spacing: 0.12em; }
#scoreText { color: #6f7480; font-size: 11px; }
#shotCount { color: #8d929c; font-size: 9px; white-space: nowrap; }

.shot-dots { display: flex; align-items: center; gap: 3px; }
.shot-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #7f8795;
  opacity: 0.14;
  transition: opacity 180ms ease, transform 180ms ease;
}
.shot-dot.active { opacity: 0.72; transform: scale(1.12); }

.message-card {
  position: absolute;
  left: 50%;
  bottom: calc(34px + env(safe-area-inset-bottom));
  width: min(86%, 390px);
  transform: translate(-50%, 12px);
  opacity: 0;
  padding: 12px 15px;
  border: 1px solid rgba(120, 125, 139, 0.08);
  border-radius: 20px;
  color: #5c616c;
  background: rgba(255, 255, 255, 0.76);
  box-shadow: 0 12px 34px rgba(104, 111, 128, 0.09);
  backdrop-filter: blur(14px);
  text-align: center;
  z-index: 11;
  pointer-events: none;
  transition: opacity 220ms ease, transform 220ms ease;
}
.message-card.visible { opacity: 1; transform: translate(-50%, 0); }
.message-card strong { display: block; font-size: 13px; margin-bottom: 4px; font-weight: 650; }
.message-card span { font-size: 10px; opacity: 0.72; }

.focus-prompt {
  position: absolute;
  left: 50%;
  top: 46%;
  width: min(88%, 410px);
  transform: translate(-50%, 10px);
  opacity: 0;
  color: #7f87a1;
  font-size: clamp(22px, 6.5vw, 30px);
  font-weight: 500;
  line-height: 1.35;
  letter-spacing: -0.035em;
  text-align: center;
  white-space: pre-line;
  text-shadow: 0 4px 22px rgba(154, 160, 183, 0.20);
  z-index: 12;
  pointer-events: none;
  transition: opacity 760ms ease, transform 880ms cubic-bezier(.22,.68,.28,1);
}
.focus-prompt.visible { opacity: 1; transform: translate(-50%, 0); }

/* Game entrance: scenery first, then interface, then aiming controls. */
#app.game-entering .home-button,
#app.game-entering #menuButton,
#app.game-entering #collectionButton,
#app.game-entering #stagePill,
#app.game-entering .score-pill,
#app.game-entering #controlHint,
#app.game-entering #focusPrompt {
  opacity: 0;
  pointer-events: none;
}
#app.game-entering .home-button,
#app.game-entering #menuButton,
#app.game-entering #collectionButton,
#app.game-entering #stagePill,
#app.game-entering .score-pill {
  transition: opacity 420ms ease;
}
#app.game-entering.game-ui-visible .home-button,
#app.game-entering.game-ui-visible #menuButton,
#app.game-entering.game-ui-visible #collectionButton,
#app.game-entering.game-ui-visible #stagePill,
#app.game-entering.game-ui-visible .score-pill {
  opacity: 1;
}
#app.game-entering.game-intro-visible #focusPrompt.visible,
#app.game-entering.game-aim-visible #controlHint,
#app.game-entering.game-aim-visible #focusPrompt.visible {
  opacity: 1;
}
.stage-intro-title {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 11;
  width: min(84%, 330px);
  padding: 30px 22px;
  color: rgba(50,55,66,.88);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -46%) scale(.97);
  transition: opacity 720ms ease, transform 900ms cubic-bezier(.22,.68,.28,1);
}
.stage-intro-title::before {
  content: '';
  position: absolute;
  inset: -22px -30px;
  z-index: -1;
  background: radial-gradient(ellipse at center, rgba(255,255,255,.70), rgba(255,255,255,.36) 48%, rgba(255,255,255,0) 76%);
}
.stage-intro-title span {
  display: block;
  margin-bottom: 12px;
  color: rgba(73,80,96,.62);
  font-size: 12px;
  font-weight: 560;
  letter-spacing: .16em;
  text-transform: uppercase;
}
.stage-intro-title strong {
  display: block;
  font-size: clamp(25px, 7.2vw, 34px);
  font-weight: 570;
  line-height: 1.48;
  letter-spacing: -.04em;
  word-break: keep-all;
}
#app.game-entering.show-stage-intro:not(.game-ui-visible) .stage-intro-title {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  z-index: 30;
  background: rgba(246, 247, 249, 0.72);
  backdrop-filter: blur(16px);
  opacity: 1;
  transition: opacity 170ms ease;
}
.overlay.hidden { display: none; }

.panel {
  position: relative;
  width: min(100%, 350px);
  padding: 30px 24px 24px;
  border: 1px solid rgba(116, 122, 137, 0.08);
  border-radius: 28px;
  background: rgba(255, 255, 255, 0.92);
  box-shadow: 0 26px 70px rgba(112, 119, 137, 0.16);
  text-align: center;
}
.panel .eyebrow { margin: 0 0 7px; color: #9499a4; font-size: 10px; letter-spacing: 0.12em; }
.panel h1 { margin: 0 0 22px; color: #3f434b; font-size: 25px; font-weight: 650; letter-spacing: -0.04em; }
.panel button:not(.back-button) {
  display: block;
  width: 100%;
  min-height: 49px;
  margin-top: 9px;
  border: 1px solid rgba(104, 110, 126, 0.09);
  border-radius: 16px;
  color: #525762;
  background: rgba(247, 248, 250, 0.88);
  font-weight: 600;
  cursor: pointer;
}
.panel button.primary { color: #fff; background: #5e6470; border-color: #5e6470; }
.back-button {
  position: absolute;
  top: 17px;
  left: 17px;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: #f4f5f7;
  color: #666b75;
  font-size: 20px;
  cursor: pointer;
}

.journal-panel { overflow: hidden; padding: 30px 24px 24px; }
.journal-page {
  position: relative;
  margin: 2px 0 22px;
  padding: 25px 20px 23px;
  border: 1px solid rgba(110, 116, 132, 0.09);
  border-radius: 18px;
  background: rgba(248, 249, 251, 0.88);
}
.journal-quote { margin: 0; color: #444952; font-size: 18px; font-weight: 550; line-height: 1.78; letter-spacing: -0.03em; word-break: keep-all; }
.journal-caption { margin: 14px 0 0; color: #a0a4ad; font-size: 9px; letter-spacing: 0.11em; }

#journalPanel.startup-minimal .journal-panel {
  max-width: 342px;
  padding: 0;
  overflow: visible;
  border: 0;
  background: transparent;
  box-shadow: none;
}
#journalPanel.startup-minimal .journal-panel > .eyebrow,
#journalPanel.startup-minimal .journal-panel > h1,
#journalPanel.startup-minimal #journalCloseButton,
#journalPanel.startup-minimal .journal-caption { display: none; }
#journalPanel.startup-minimal .journal-page {
  margin: 0;
  padding: 36px 31px;
  border: 1px solid rgba(117, 123, 139, 0.08);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 24px 64px rgba(114, 121, 139, 0.15);
}
#journalPanel.startup-minimal .journal-quote {
  margin: 0;
  padding: 0;
  color: #3f444d;
  font-size: 19px;
  font-weight: 550;
  line-height: 1.95;
  letter-spacing: -0.04em;
  text-align: left;
  white-space: pre-line;
}

.final-score { margin: -8px 0 2px; color: #545a66; font-size: 56px; line-height: 1; font-weight: 700; }
.result-panel #resultTitle,
.result-panel #bestScore { display: none; }
.result-panel .final-score { margin: 2px 0 18px; }
.result-panel { max-height: calc(100dvh - 44px); overflow-y: auto; scrollbar-width: none; }
.result-panel::-webkit-scrollbar { display: none; }
.result-panel p#bestScore { margin: 7px 0 15px; color: #959aa5; font-size: 10px; }
.result-sheet { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 14px 0 11px; }
.result-shot { position: relative; min-height: 51px; padding: 7px 2px 4px; border: 1px solid rgba(104, 110, 125, 0.09); border-radius: 12px; background: #fafbfc; }
.result-shot-number { position: absolute; top: 4px; left: 6px; color: #a2a6ae; font-size: 8px; }
.result-symbol { display: block; margin-top: 7px; font-size: 25px; line-height: 1; font-weight: 600; }
.result-symbol.circle { color: #bd6762; }
.result-symbol.triangle { color: #7d8b90; }
.result-symbol.miss { color: #575c65; }
.result-summary { margin: 0 0 14px; color: #898e98; font-size: 10px; }
.emotion-postcard {
  display: block;
  width: 100%;
  aspect-ratio: 8 / 5;
  height: auto;
  margin: 0;
  border-radius: 18px;
  box-shadow: 0 16px 38px rgba(64, 66, 82, .14);
  background: #e9e8ec;
}
.postcard-wrap {
  position: relative;
  width: min(100%, 320px);
  margin: 16px auto 12px;
}
.result-choice-prompt { margin: 17px 0 11px; color: #737986; font-size: 13px; font-weight: 560; }
.result-message-list { display: grid; gap: 7px; margin: 0 0 3px; }
.result-message-option {
  width: 100%; min-height: 0 !important; margin: 0 !important; padding: 12px 14px !important;
  border: 1px solid rgba(255,255,255,.13) !important; border-radius: 13px !important;
  color: rgba(255,255,255,.96) !important; background: rgba(65,71,82,.94) !important;
  font-size: 12px !important; font-weight: 520 !important; line-height: 1.55;
  white-space: pre-line; word-break: keep-all;
}
.result-message-option:active { background: rgba(83,90,103,.96) !important; }
.result-card-stage.hidden { display: none; }
#resultConfirmButton.hidden { display: none !important; }
.result-panel.message-selecting .postcard-wrap,
.result-panel.message-selecting #resultConfirmButton { display: none; }
.result-panel.postcard-selected .result-choice-prompt,
.result-panel.postcard-selected .result-message-list { display: none; }
.life-journal-launch { display: flex !important; align-items: center; justify-content: center; gap: 10px; min-height: 56px !important; margin-top: 15px !important; border: 1px solid rgba(111, 118, 136, 0.09) !important; background: #f8f9fb !important; }
.life-journal-icon { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid rgba(120, 126, 143, 0.14); border-radius: 50%; color: #7c8390; font-size: 17px; }
.life-journal-copy { display: grid; text-align: left; line-height: 1.2; }
.life-journal-copy strong { font-size: 13px; }
.life-journal-copy small { margin-top: 3px; color: #9a9fa8; font-size: 9px; font-weight: 500; }
.life-journal-panel { max-height: calc(100dvh - 44px); overflow-y: auto; padding-top: 30px; scrollbar-width: none; }
.life-journal-panel::-webkit-scrollbar { display: none; }
.life-journal-prompt { margin: -8px 0 17px; color: #969ba5; font-size: 11px; }
.emotion-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.emotion-grid button { min-height: 45px !important; margin: 0 !important; padding: 8px 5px; font-size: 13px; }
.emotion-grid button[data-tone="quiet"] { background: #f1f5f5; }
.emotion-grid button[data-tone="warm"] { background: #faf4f1; }
.emotion-grid button[data-tone="heavy"] { background: #f2f2f4; }
.emotion-grid button[data-tone="sharp"] { background: #f6f0f1; }
.life-record-page { position: relative; min-height: 220px; margin: 0 0 17px; padding: 30px 21px 24px; border: 1px solid rgba(107, 113, 129, 0.09); border-radius: 18px; background: #fafbfc; text-align: left; }
.life-record-emotion { margin: 0 0 18px; color: #777e8a; font-size: 13px; letter-spacing: 0.08em; }
.life-record-message { margin: 0; color: #464b54; font-size: 17px; font-weight: 550; line-height: 1.78; word-break: keep-all; }
.life-history { margin: 4px 0 17px; padding-top: 15px; border-top: 1px solid rgba(105, 111, 126, 0.09); text-align: left; }
.life-history-header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.life-history-header h2 { margin: 0; color: #555a64; font-size: 14px; }
.life-history-count { color: #a1a5ae; font-size: 9px; }
.life-history-list { display: grid; gap: 8px; }
.life-history-item { padding: 11px 12px; border: 1px solid rgba(105, 111, 126, 0.08); border-radius: 13px; background: #fafbfc; }
.life-history-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.life-history-emotion { color: #747b87; font-size: 11px; font-weight: 700; }
.life-history-time { color: #a3a7af; font-size: 8px; white-space: nowrap; }
.life-history-message { margin: 0; color: #5c616b; font-size: 11px; line-height: 1.55; word-break: keep-all; }
.hidden-view { display: none; }
.rotate-notice { display: none; position: fixed; inset: 0; z-index: 100; place-items: center; color: #5b606a; background: #f7f8fa; font-weight: 650; }
@media (orientation: landscape) and (max-height: 520px) { .rotate-notice { display: grid; } }


/* ===== Sample-image visual rebuild ===== */
:root {
  color: #3f4148;
  background: #f7f7f7;
}
html, body { background: #f5f5f5; }
#app {
  background: #fff;
  box-shadow: 0 0 45px rgba(75, 80, 91, 0.08);
}
#gameCanvas { position: absolute; inset: 0; z-index: 1; }
.compat-hidden { display: none !important; }

.icon-button {
  top: calc(23px + env(safe-area-inset-top));
  left: 22px;
  width: 51px;
  height: 51px;
  border: 1px solid rgba(91, 96, 108, 0.055);
  background: rgba(255,255,255,0.86);
  box-shadow: 0 7px 22px rgba(81, 87, 101, 0.10);
  backdrop-filter: blur(12px);
  gap: 4.5px;
}
.icon-button span { width: 19px; height: 1.55px; background: #34373d; }

.stage-pill {
  position: absolute;
  top: calc(29px + env(safe-area-inset-top));
  left: 50%;
  z-index: 10;
  min-width: 124px;
  height: 35px;
  transform: translateX(-50%);
  display: grid;
  place-items: center;
  border: 1px solid rgba(98, 103, 116, 0.065);
  border-radius: 999px;
  background: rgba(255,255,255,0.78);
  box-shadow: 0 5px 18px rgba(84, 90, 104, 0.075);
  color: #9699a1;
  font-size: 12px;
  font-weight: 560;
  letter-spacing: 0.105em;
  backdrop-filter: blur(12px);
}

.shot-progress {
  position: absolute;
  top: calc(84px + env(safe-area-inset-top));
  left: 50%;
  z-index: 10;
  transform: translateX(-50%);
  display: flex;
  align-items: baseline;
  gap: 9px;
  line-height: 1;
  pointer-events: auto;
}
.shot-progress strong {
  color: #282b30;
  font-size: clamp(54px, 15vw, 66px);
  font-weight: 420;
  letter-spacing: -0.065em;
}
.shot-progress span { color: #a2a5ac; font-size: 26px; font-weight: 350; }

.score-pill {
  position: absolute;
  top: calc(27px + env(safe-area-inset-top));
  right: 20px;
  z-index: 10;
  min-width: 94px;
  height: 40px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid rgba(99, 104, 117, 0.06);
  border-radius: 999px;
  background: rgba(255,255,255,0.79);
  box-shadow: 0 5px 18px rgba(84, 90, 104, 0.075);
  color: #464a51;
  backdrop-filter: blur(12px);
}
.score-pill strong { font-size: 16px; font-weight: 520; }
.score-flower { color: #a8b8d8; font-size: 15px; opacity: .8; }
.score-plus { color: #9b9fa8; font-size: 17px; font-weight: 350; }

.focus-prompt {
  top: 31.5%;
  color: #8993b5;
  font-size: clamp(23px, 6.4vw, 31px);
  font-weight: 470;
  letter-spacing: -0.035em;
  text-shadow: 0 7px 26px rgba(138, 145, 178, 0.18);
}
.focus-prompt::after {
  content: '';
  display: block;
  width: 78px;
  height: 1px;
  margin: 8px auto 0;
  background: linear-gradient(90deg, rgba(144,173,194,.05), rgba(137,147,184,.42), rgba(191,160,190,.05));
}

.control-hint {
  position: absolute;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom));
  z-index: 8;
  width: 250px;
  height: 270px;
  transform: translateX(-50%);
  pointer-events: none;
  transition: transform .18s ease, opacity .18s ease;
}
.control-orbit {
  position: absolute;
  left: 50%;
  bottom: 125px;
  width: 129px;
  height: 122px;
  transform: translateX(-50%);
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 52% 48% 56% 44% / 44% 56% 46% 54%;
  background: transparent;
  box-shadow: none;
  animation: controlWaterBreath 3.6s ease-in-out infinite;
  will-change: transform, border-radius;
}
.control-orbit::before,
.control-orbit::after {
  display: none;
}
.control-orbit::before {
  width: 42px;
  height: 20px;
  left: 21px;
  top: 17px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(255,255,255,.46) 0%, rgba(255,255,255,0) 74%);
  transform: rotate(-22deg);
  filter: blur(1px);
}
.control-orbit::after {
  width: 36px;
  height: 36px;
  left: calc(50% - 18px);
  top: calc(50% - 18px);
  border-radius: 45%;
  background:
    linear-gradient(90deg, transparent 42%, rgba(42,39,73,.72) 43%, rgba(42,39,73,.72) 57%, transparent 58%),
    linear-gradient(0deg, transparent 42%, rgba(42,39,73,.72) 43%, rgba(42,39,73,.72) 57%, transparent 58%);
  filter: drop-shadow(0 1px 2px rgba(35,31,68,.18));
  transform: rotate(-2deg);
}
.pull-arrow {
  position: absolute;
  left: calc(50% + 72px);
  bottom: 178px;
  color: rgba(68, 55, 111, .74);
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity .2s ease;
  animation: pullArrowBounce .9s ease-in-out infinite alternate;
}
.control-hint.pull-cue .pull-arrow { opacity: 1; }
@keyframes pullArrowBounce {
  from { transform: translateY(-8px); }
  to { transform: translateY(6px); }
}
@keyframes controlWaterBreath {
  0%, 100% {
    transform: translateX(-50%) scale(.965, .97);
    border-radius: 52% 48% 56% 44% / 44% 56% 46% 54%;
  }
  35% {
    transform: translateX(-50%) scale(1.025, 1.018);
    border-radius: 47% 53% 50% 50% / 51% 46% 54% 49%;
  }
  68% {
    transform: translateX(-50%) scale(.992, 1.03);
    border-radius: 55% 45% 47% 53% / 48% 57% 43% 52%;
  }
}
.control-core {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.20);
  box-shadow: inset 0 0 22px rgba(255,255,255,.22);
  color: rgba(118,127,145,.25);
}
.control-core svg { width: 34px; height: 34px; opacity: .55; }
.aim-guide {
  position: absolute;
  left: calc(50% - 26px);
  bottom: 190px;
  width: 52px;
  height: 92px;
  transform: rotate(var(--aim-angle, 0deg));
  transform-origin: 50% 100%;
  opacity: .74;
  filter: drop-shadow(0 2px 4px rgba(89, 85, 105, .055));
  transition: opacity .22s ease, transform .10s linear;
  will-change: transform;

/* ===== 심상의 세계 · 입장 / 장소 / 그림 선택 ===== */
:root {
  --mind-font: "Arial Narrow", "Aptos Narrow", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
.background-selector {
  position: absolute;
  inset: 0;
  z-index: 80;
  overflow: hidden;
  color: #34373d;
  background: #fff;
  transition: opacity .28s ease, visibility .28s ease;
}
.background-selector.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.selector-view {
  position: absolute;
  inset: 0;
  opacity: 1;
  visibility: visible;
  transition: opacity .34s ease, visibility .34s ease;
}
.selector-view.hidden-view {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.mind-tall-text {
  font-family: var(--mind-font);
  font-stretch: condensed;
  letter-spacing: -.035em;
}

/* 접속 문구 */
.intro-view {
  display: grid;
  place-items: center;
  padding: 0 30px;
  background: #fff;
}
.intro-phrase {
  width: 100%;
  min-height: 58px;
  color: #43464c;
  font-family: var(--mind-font);
  font-size: clamp(21px, 5.8vw, 27px);
  font-weight: 560;
  line-height: 1.55;
  letter-spacing: -.045em;
  text-align: center;
  white-space: normal;
  transform: scaleX(.93);
  transform-origin: center;
}
.intro-word {
  display: inline-block;
  white-space: nowrap;
}
.intro-glyph {
  display: inline-block;
  opacity: 0;
  filter: blur(2.2px);
  transform: translateY(.35px);
  will-change: opacity, filter, transform;
}

/* 장소 목록: 중심 원형 + 워드클라우드형 장소명 */
.category-view {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #fff;
  display: grid;
  place-items: center;
  padding: calc(38px + env(safe-area-inset-top)) 20px calc(42px + env(safe-area-inset-bottom));
}
.location-cluster {
  position: relative;
  width: min(92vw, 430px);
  height: min(74vh, 620px);
}
.location-hub {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 210px;
  height: 210px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background:
    radial-gradient(circle at 36% 34%, rgba(189, 225, 233, .60) 0%, rgba(189, 225, 233, .30) 28%, rgba(189, 225, 233, .12) 54%, rgba(189, 225, 233, 0) 76%),
    radial-gradient(circle at 66% 64%, rgba(173, 212, 199, .46) 0%, rgba(173, 212, 199, .18) 35%, rgba(173, 212, 199, 0) 68%),
    radial-gradient(circle at 50% 50%, rgba(232, 238, 243, .55) 0%, rgba(232, 238, 243, .16) 48%, rgba(232, 238, 243, 0) 76%);
  filter: blur(3px);
  opacity: .98;
  pointer-events: none;
}
.location-list {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.location-button {
  --x: 0px;
  --y: 0px;
  --ink: #6f90a0;
  --size: 28px;
  appearance: none;
  position: absolute;
  left: 50%;
  top: 50%;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--mind-font);
  font-size: var(--size);
  font-weight: 560;
  line-height: 1.05;
  letter-spacing: -.05em;
  text-align: center;
  white-space: nowrap;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  text-shadow: 0 0 14px rgba(255,255,255,.5), 0 0 2px rgba(255,255,255,.72);
  opacity: 0;
  filter: blur(10px);
  transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y) + 10px)) scale(.88);
  transition:
    opacity .24s ease,
    filter .30s ease,
    transform .34s cubic-bezier(.2,.75,.2,1),
    color .18s ease;
}
.location-button.visible {
  opacity: 1;
  filter: blur(0);
  transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1);
}
.location-button:active {
  opacity: .86;
  transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y) + 1px)) scale(.985);
}

  letter-spacing: -.04em;
  transform: translateX(-50%) scaleX(.95);

.preview-confirm:active { transform: translateX(-50%) scale(.97,.95); }
.preview-empty {

/* 첫 진입 감정 선택 화면 */
.emotion-entry-view { overflow: hidden; background: #fff; color: #343943; }
.emotion-entry-title {
  position: absolute; z-index: 3; top: calc(48px + env(safe-area-inset-top));
  left: 0; width: 100%; margin: 0; text-align: center;
  font-family: var(--mind-font); font-size: clamp(22px, 6vw, 27px);
  font-weight: 560; letter-spacing: -.045em;
}
.emotion-map {
  position: absolute;
  inset: calc(112px + env(safe-area-inset-top)) 15px calc(72px + env(safe-area-inset-bottom));
}
.emotion-map-button {
  position: absolute; min-width: 48px; min-height: 34px; padding: 7px 9px;
  border: 0; border-radius: 18px; background: transparent; color: #6b7079;
  font-family: var(--mind-font); font-size: clamp(12px, 3.45vw, 15px);
  letter-spacing: -.04em; white-space: nowrap; transform: translate(-50%, -50%);

  touch-action: manipulation;
}
.emotion-map-button:active, .emotion-map-button:focus-visible {
  color: #293c64; background: rgba(54,76,119,.09); outline: none;
  transform: translate(-50%, -50%) scale(.94);
}
.emotion-entry-guide {
  position: absolute; z-index: 2; left: 50%; bottom: calc(30px + env(safe-area-inset-bottom));
  width: min(59vw, 230px); height: 226px; object-fit: contain; object-position: center bottom;
  transform: translateX(-50%); pointer-events: none; user-select: none;
}

/* 장소 선택 화면 */
.category-view {
  display: flex; flex-direction: column; align-items: center;
  padding: calc(48px + env(safe-area-inset-top)) 28px calc(36px + env(safe-area-inset-bottom));
  background: #fff;
}
.door-question {
  position: static; z-index: 1; margin: 0 0 22px; color: #43464c;
  font-family: var(--mind-font); font-size: clamp(22px, 6vw, 27px);
  font-weight: 560; letter-spacing: -.045em; text-align: center;
}
.location-cluster {
  position: relative; width: min(88vw, 342px); height: auto; flex: 0 0 auto;
}
.location-hub { display: none; }
.location-list {
  position: static; inset: auto; display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: clamp(2px, 1vh, 8px) 10px;
  width: 100%; height: auto;
}
.category-guide {
  position: relative;
  z-index: 5;
  width: 88px;
  height: 102px;
  margin-top: clamp(3px, 1vh, 9px);
  object-fit: contain;
  object-position: center;
  opacity: .72;
  pointer-events: none;
  user-select: none;
  transform-origin: center 70%;
  will-change: transform, opacity;
}
.category-view.location-entering .location-button {
  opacity: 0;
  transform: scale(.97);
  transition: opacity 420ms ease, transform 520ms ease;
}
.category-view.location-entering .location-button.location-selected {
  opacity: 1;
  transform: translate(var(--label-x), var(--label-y)) scale(1.22);
  color: #36466a;
  border-bottom-color: transparent;
  z-index: 4;
  isolation: isolate;
  transition: transform 720ms cubic-bezier(.22,.68,.26,1), color 420ms ease;
}
.category-view.location-entering .location-button.location-selected::after {
  content: '';
  position: absolute;
  inset: -18px -32px;
  z-index: -1;
  border-radius: 48%;
  pointer-events: none;
  opacity: 0;
  transform: scale(.55);
  background: radial-gradient(ellipse at center,
    rgba(72,101,151,.18) 0%,
    rgba(92,128,173,.10) 34%,
    rgba(127,153,184,.04) 58%,
    rgba(255,255,255,0) 78%);
  filter: blur(7px);
  animation: locationInkAbsorb 550ms ease-out 2450ms forwards;
}
.category-guide.walking-into-location {
  animation: guideWalkIntoLocation 2500ms cubic-bezier(.32,.58,.22,1) 450ms forwards;
}
@keyframes guideWalkIntoLocation {
  0% { opacity: .82; clip-path: ellipse(82% 82% at 50% 38%); filter: blur(0); transform: translate(0, 0) scale(1) rotate(0deg); }
  88% { opacity: .62; clip-path: ellipse(82% 82% at 50% 38%); filter: blur(0); transform: translate(var(--walk-x), var(--walk-y)) scale(.60) rotate(0deg); }
  94% { opacity: .32; clip-path: ellipse(48% 42% at 50% 27%); filter: blur(1.8px); transform: translate(var(--walk-x), var(--walk-y)) scale(.52) rotate(0deg); }
  100% { opacity: 0; clip-path: ellipse(2% 2% at 50% 20%); filter: blur(5px); transform: translate(var(--walk-x), var(--walk-y)) scale(.46) rotate(0deg); }
}
@keyframes locationInkAbsorb {
  0% { opacity: 0; transform: scale(.55); }
  42% { opacity: .72; transform: scale(.92); }
  100% { opacity: 0; transform: scale(1.35); }
}
.location-button {
  position: relative; left: auto; top: auto; width: 100%;
  height: clamp(92px, 13.4vh, 116px); min-height: 0; padding: 0; margin: 0;
  display: grid; place-items: center;
  border: 0; border-radius: 0;
  background: transparent; color: #4d5359; opacity: 1; filter: none;
  font-family: var(--mind-font); font-size: 18px; font-weight: 560;
  letter-spacing: -.035em; text-align: center; touch-action: manipulation; transform: none;
  transition: color .16s ease, transform .16s ease, opacity .42s ease;
}
.location-scroll-image {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  pointer-events: none; user-select: none;
  opacity: .72;
  filter: blur(.45px) drop-shadow(0 3px 7px rgba(38,45,54,.05));
}
.location-scroll-label {
  position: relative; z-index: 1; transform: translateY(1px);
  font-family: "Gungsuh", "궁서", "Nanum Brush Script", serif;
  font-size: 21px; font-weight: 400; letter-spacing: .08em;
  text-shadow: 0 1px 7px rgba(255,255,255,.78);
  pointer-events: none;
}
.location-button:active, .location-button:focus-visible {
  color: #293c64; background: transparent; outline: none; transform: scale(.97);
}

@media (max-height: 700px) {
  .emotion-entry-title { top: calc(30px + env(safe-area-inset-top)); }
  .emotion-map { inset: calc(82px + env(safe-area-inset-top)) 12px calc(52px + env(safe-area-inset-bottom)); }
  .emotion-entry-guide { width: 174px; height: 170px; bottom: calc(18px + env(safe-area-inset-bottom)); }
  .category-view { padding-top: calc(32px + env(safe-area-inset-top)); }
  .door-question { margin-bottom: 12px; }
  .location-list { gap: 0 8px; }
  .location-button { height: clamp(82px, 13vh, 94px); font-size: 16px; }
  .category-guide { width: 70px; height: 80px; margin-top: 2px; }
}



/* ===== Infinite mode HUD / navigation ===== */
.home-button {
  position: absolute;
  top: calc(23px + env(safe-area-inset-top));
  left: 22px;
  z-index: 16;
  width: 51px;
  height: 51px;

  place-items: center;

  color: rgba(52,55,61,.82);
  background: rgba(255,255,255,0.86);
  box-shadow: 0 7px 22px rgba(81, 87, 101, 0.10);
  backdrop-filter: blur(12px);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.home-button { display: none !important; }
.home-button svg { width: 21px; height: 21px; }
.home-button:active { transform: scale(.96); opacity: .78; }

#menuButton { left: 22px !important; }
.collection-button { left: 82px !important; }
.collection-button svg { width: 23px; height: 23px; }
.collection-panel { max-height: calc(100dvh - 38px); overflow-y: auto; padding-top: 72px; scrollbar-width: none; }
.collection-panel::-webkit-scrollbar { display: none; }
.collection-empty { margin: 34px 0; color: #9a9fa8; font-size: 12px; line-height: 1.7; }
.collection-emotions { display: grid; gap: 8px; }
.collection-emotion-button {
  display: flex !important; align-items: center; justify-content: space-between;
  min-height: 50px !important; margin: 0 !important; padding: 11px 15px !important;
}
.collection-emotion-button span { font-size: 14px; }
.collection-emotion-button small { color: #9ba0aa; font-size: 10px; }
.collection-cards { display: grid; gap: 18px; }
.collection-card { position: relative; }
.collection-card-canvas { display: block; width: 100%; aspect-ratio: 8 / 5; border-radius: 18px; background: #ebecef; box-shadow: 0 12px 30px rgba(65,70,83,.12); }
.collection-duplicate { margin: 0 0 8px; color: #747b87; font-size: 11px; font-weight: 560; }
.collection-card-nav { display: flex; align-items: center; justify-content: center; gap: 13px; margin-top: 7px; color: #9297a1; font-size: 10px; }
.collection-card-nav button { width: 35px !important; min-height: 30px !important; margin: 0 !important; padding: 0 !important; border-radius: 12px !important; }
.stage-pill,
.shot-progress { display: none !important; }

.score-pill {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  left: 50%;
  right: auto;
  z-index: 12;
  min-width: 128px;
  height: 78px;
  padding: 8px 23px 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 0;
  border-radius: 47% 53% 45% 55% / 56% 45% 55% 44%;
  background:
    radial-gradient(circle at 38% 30%, rgba(255,255,255,.96) 0%, rgba(255,255,255,.82) 42%, rgba(255,255,255,.57) 72%, rgba(255,255,255,.22) 100%);
  box-shadow:
    0 10px 32px rgba(72, 83, 98, .075),
    0 0 32px rgba(255,255,255,.75);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  font-family: var(--mind-font);
  transform: translateX(-50%) rotate(-.4deg);
}
.score-pill::before {
  content: '';
  position: absolute;
  inset: -7px -9px;
  z-index: -1;
  border-radius: 55% 45% 58% 42% / 44% 58% 42% 56%;
  background: rgba(255,255,255,.24);
  filter: blur(7px);
  pointer-events: none;
}
.streak-label {
  color: rgba(57,63,72,.66);
  font-family: var(--mind-font);
  font-size: 13px;
  font-weight: 610;
  letter-spacing: -.055em;
  transform: scaleX(.93);
}
.score-pill strong {
  min-width: 38px;
  color: rgba(42,47,55,.94);
  font-family: var(--mind-font);
  font-size: 43px;
  line-height: .95;
  font-weight: 680;
  letter-spacing: -.075em;
  text-align: center;
  text-shadow: 0 2px 10px rgba(71,82,98,.08);
  transform: scaleX(.91);
}

/* 12발 회차 UI 복원, 연속 명중 UI 제거 */
.shot-progress {
  display: flex !important;
  top: calc(6px + env(safe-area-inset-top));
  left: auto;
  right: 12px;
  transform: none;
  z-index: 16;
  min-width: 132px;
  min-height: 82px;
  padding: 8px 19px 9px;
  justify-content: center;
  border: 0;
  background: transparent;
  box-shadow: none;
  isolation: isolate;
}
.shot-progress::before {
  content: '';
  position: absolute;
  inset: -5px -18px;
  z-index: -1;
  pointer-events: none;
  border-radius: 30px;
  background: rgba(255,255,255,.60);
  filter: blur(14px);
}
.stage-pill {
  display: block !important;
  top: calc(17px + env(safe-area-inset-top));
  left: 50%;
  width: min(34%, 142px);
  min-width: 0;
  height: auto;
  padding: 6px 5px;
  border: 0;
  border-radius: 22px;
  color: rgba(58,64,75,.66);
  background: rgba(255,255,255,.48);
  filter: drop-shadow(0 0 11px rgba(255,255,255,.80));
  box-shadow: none;
  backdrop-filter: none;
  font-family: var(--mind-font);
  font-size: clamp(9px, 2.55vw, 11px);
  font-weight: 540;
  line-height: 1.42;
  letter-spacing: -.035em;
  text-align: center;
  white-space: normal;
  word-break: keep-all;
  pointer-events: none;
}
.focus-prompt {
  top: calc(126px + env(safe-area-inset-top));
  width: min(86%, 360px);
  padding: 11px 16px 12px;
  border: 0;
  color: rgba(65,72,88,.82);
  background: transparent;
  box-shadow: none;
  font-size: clamp(14px, 4vw, 17px);
  line-height: 1.55;
  text-shadow: none;
  isolation: isolate;
}
.focus-prompt::before {
  content: '';
  position: absolute;
  inset: -5px -14px;
  z-index: -1;
  pointer-events: none;
  border-radius: 28px;
  background: rgba(255,255,255,.60);
  filter: blur(14px);
}
.focus-prompt::after { display: none; }
.score-pill { display: none !important; }
#app.game-entering .shot-progress { opacity: 0; pointer-events: none; transition: opacity 420ms ease; }
#app.game-entering.game-ui-visible .shot-progress { opacity: 1; }

.fail-panel { padding-top: 34px; }
.fail-panel h1 {
  margin-bottom: 25px;
  font-size: 26px;
  font-weight: 570;
}
.fail-panel .fail-caption {
  margin: -10px 0 19px;
  color: #9ba0a9;
  font-size: 10px;
  line-height: 1.55;
}

</style>
</head>

  <main id="app" aria-label="심상 활쏘기 게임">
    <canvas id="gameCanvas" width="390" height="844" aria-label="활쏘기 게임 화면"></canvas>

  function seededRandom(seed) {
    let value = (Number(seed) || 1) % 2147483647;
    if (value <= 0) value += 2147483646;
    return () => ((value = value * 16807 % 2147483647) - 1) / 2147483646;
  }

  function makeMountainPath(rand, width, baseY, peakCount, heightScale) {
    const segment = width / peakCount;
    let d = `M0,${baseY.toFixed(1)}`;
    let currentY = baseY - heightScale * (.04 + rand() * .10);
    for (let i = 0; i < peakCount; i += 1) {
      const startX = i * segment;
      const endX = (i + 1) * segment;
      const peakX = startX + segment * (.38 + rand() * .20);
      const peakY = baseY - heightScale * (.42 + rand() * .58);
      const valleyY = baseY - heightScale * (.04 + rand() * .18);
      d += ` C${(startX + segment * .14).toFixed(1)},${(currentY - heightScale * (.05 + rand() * .10)).toFixed(1)}`;
      d += ` ${(peakX - segment * .16).toFixed(1)},${(peakY + heightScale * (.07 + rand() * .08)).toFixed(1)}`;
      d += ` ${peakX.toFixed(1)},${peakY.toFixed(1)}`;
      d += ` C${(peakX + segment * .14).toFixed(1)},${(peakY + heightScale * (.08 + rand() * .10)).toFixed(1)}`;
      d += ` ${(endX - segment * .16).toFixed(1)},${(valleyY - heightScale * (.02 + rand() * .05)).toFixed(1)}`;
      d += ` ${endX.toFixed(1)},${valleyY.toFixed(1)}`;
      currentY = valleyY;
    }
    d += ` L${width},${(baseY + heightScale * .9).toFixed(1)} L0,${(baseY + heightScale * .9).toFixed(1)} Z`;
    return d;
  }

    layerDefs.forEach((layer, index) => {

    const sea = theme === 'sea' ? `

      <path d="M0 ${height*.67} Q${width*.25} ${height*.65} ${width*.50} ${height*.675} T${width} ${height*.665}" fill="none" stroke="#789baa" stroke-width="3" opacity=".18"/>
      <path d="M${width*.18} ${height*.72} q48 -26 95 0 q-46 12 -95 0z" fill="${palette[0]}" opacity=".14"/>` : '';
    const sky = theme === 'sky' ? `
      <g fill="#fff" opacity=".72"><ellipse cx="${width*.24}" cy="${height*.39}" rx="150" ry="44"/><ellipse cx="${width*.63}" cy="${height*.48}" rx="190" ry="56"/><ellipse cx="${width*.50}" cy="${height*.69}" rx="230" ry="64"/></g>` : '';
    const space = theme === 'space' ? `
      <rect width="100%" height="100%" fill="#686d86" opacity=".11"/>
      ${Array.from({length:38},()=>`<circle cx="${(rand()*width).toFixed(1)}" cy="${(rand()*height*.70).toFixed(1)}" r="${(.6+rand()*1.8).toFixed(1)}" fill="#fff" opacity="${(.20+rand()*.55).toFixed(2)}"/>`).join('')}
      <circle cx="${width*.73}" cy="${height*.22}" r="42" fill="#fff" opacity=".42"/>` : '';
    const floating = theme === 'fantasy' ? `
      <g fill="${palette[0]}" opacity=".18"><path d="M${width*.15} ${height*.46} q90 -90 180 0 q-85 48 -180 0z"/><path d="M${width*.62} ${height*.38} q72 -74 144 0 q-68 42 -144 0z"/></g>` : '';
    const moon = fantasy && theme !== 'space' ? `<circle cx="${(width * (.69 + rand() * .10)).toFixed(0)}" cy="${(height * .20).toFixed(0)}" r="${(width * .035).toFixed(0)}" fill="#fff" opacity=".72"/>` : '';

    return `<?xml version="1.0" encoding="UTF-8"?>
      <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
        <defs>
          <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fafbfb"/></linearGradient>
          <radialGradient id="mist" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#fff" stop-opacity=".98"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          ${layerDefs.map((layer, i) => `<filter id="blur${i}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${layer.blur}"/></filter>`).join('')}
        </defs>
        <rect width="100%" height="100%" fill="url(#paper)"/>
        <circle cx="${width * .2}" cy="${height * .18}" r="${width * .18}" fill="${palette[1]}" opacity=".045" filter="url(#blur1)"/>
        ${space}${moon}${layers.join('')}${sea}${sky}${forest}${tinyAnimals}${children}${floating}
        <ellipse cx="${width * .5}" cy="${height * .57}" rx="${width * .68}" ry="${height * .20}" fill="url(#mist)"/>

  function sceneImageSource(scene) {

  function sceneImageFilter(scene) {
    const seed = Number(scene?.seed) || 1;
    const hue = ((seed * 7) % 25) - 12;
    const saturation = scene?.fantasy ? .88 : .72;
    return `brightness(1.04) saturate(${saturation}) sepia(.05) hue-rotate(${hue}deg)`;
  }

  function getSceneImage(scene) {
    if (!scene) return sceneBackground;
    const cacheKey = scene.id || `${scene.title}-${scene.seed}`;
    if (backgroundImageCache.has(cacheKey)) return backgroundImageCache.get(cacheKey);
    const image = new Image();
    image.decoding = 'async';
    image.src = sceneImageSource(scene);
    backgroundImageCache.set(cacheKey, image);
    return image;
  }

  function parseIntroText(raw) {

    const lines = raw.split(/\r?\n/).map((line) => line.trim()).filter((line) => line && !line.startsWith('#'));
    const values = [];
    lines.forEach((line) => {
      const eq = line.indexOf('=');
      values.push(eq >= 0 ? line.slice(eq + 1).trim() : line);
    });
    return values.length >= 2 ? values.slice(0, 2) : DEFAULT_INTRO_TEXTS;
  }

  function makeIntroWord(word) {
    const wordSpan = document.createElement('span');

  function animateIntroWordIn(wordSpan) {
    const glyphs = Array.from(wordSpan.querySelectorAll('.intro-glyph'));
    glyphs.forEach((glyph, index) => {
      glyph.animate([
        { opacity: 0, filter: 'blur(2.2px)', transform: 'translateY(.35px)' },
        { opacity: .72, filter: 'blur(.65px)', transform: 'translateY(.08px)', offset: .62 },
        { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0)' },
      ], {
        duration: 400,
        delay: index * 18,
        easing: 'cubic-bezier(.18,.78,.22,1)',
        fill: 'forwards',
      });
    });
  }

  function animateIntroWordOut(wordSpan) {
    const glyphs = Array.from(wordSpan.querySelectorAll('.intro-glyph'));
    glyphs.forEach((glyph, index) => {
      glyph.animate([
        { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0)' },
        { opacity: .62, filter: 'blur(.45px)', transform: 'translateY(-.05px)', offset: .42 },
        { opacity: 0, filter: 'blur(1.8px)', transform: 'translateY(-.25px)' },
      ], {
        duration: 520,
        delay: index * 42,
        easing: 'cubic-bezier(.22,.65,.25,1)',
        fill: 'forwards',
      });
    });
  }

  async function playIntroPhrase(text, { pauseAfterFirst = false } = {}) {
    introPhrase.innerHTML = '';
    const words = String(text || '').trim().split(/\s+/).filter(Boolean);
    const spans = words.map(makeIntroWord);

    spans.forEach((span, index) => {
      introPhrase.appendChild(span);
      if (index < spans.length - 1) introPhrase.appendChild(document.createTextNode(' '));
    });

    if (!spans.length) return;

    // 기존 버전의 템포는 그대로 유지한다.
    const normalGap = 520;
    const firstGap = pauseAfterFirst ? 820 : normalGap;
    const revealTimes = spans.map((_, index) => index === 0 ? 0 : firstGap + (index - 1) * normalGap);
    const timers = [];

    revealTimes.forEach((time, index) => {
      timers.push(window.setTimeout(() => animateIntroWordIn(spans[index]), time));
    });

    // 두 번째 다음 단어가 등장하는 순간, 두 칸 전 단어가 왼쪽 글자부터 녹듯 사라진다.
    const lastReveal = revealTimes[revealTimes.length - 1] || 0;
    spans.forEach((span, index) => {
      let leaveTime;
      if (index + 2 < spans.length) {
        leaveTime = revealTimes[index + 2];
      } else if (spans.length === 1) {
        leaveTime = pauseAfterFirst ? 820 : normalGap;
      } else if (index === spans.length - 2) {
        leaveTime = lastReveal + normalGap;
      } else {
        leaveTime = lastReveal + normalGap * 2;
      }
      timers.push(window.setTimeout(() => animateIntroWordOut(span), leaveTime));
    });

    // 가장 긴 단어의 글자별 소거가 끝난 뒤 화면을 정리한다.
    const maxGlyphCount = Math.max(...words.map((word) => Array.from(word).length));
    const wipeDuration = 520 + Math.max(0, maxGlyphCount - 1) * 42;
    const totalDuration = lastReveal + normalGap * 2 + wipeDuration + 120;
    await sleep(totalDuration);

    timers.forEach((timerId) => clearTimeout(timerId));
    introPhrase.innerHTML = '';
    await sleep(140);
  }

  function stopDoorMotion() {
    if (doorMotionFrame) cancelAnimationFrame(doorMotionFrame);
    doorMotionFrame = 0;
    doorMotionLastTime = 0;
  }

  function setDoorWallTilt(item, amount) {
    item.tiltTarget = amount;
    item.tiltHold = .22;
  }

  function updateDoorTilt(item, dt = 0) {
    if (!Number.isFinite(item.tilt) || dt <= 0) item.tilt = 0;
    if (dt > 0) {
      item.tiltHold = Math.max(0, (item.tiltHold || 0) - dt);
      if (item.tiltHold <= 0) item.tiltTarget = 0;
      const turnAmount = 1 - Math.exp(-5 * dt);
      item.tilt += ((item.tiltTarget || 0) - item.tilt) * turnAmount;
    }
    item.icon?.style.setProperty('--door-tilt', `${item.tilt}deg`);
  }

  function startDoorMotion() {
    stopDoorMotion();
    if (state.status !== 'selecting' || categoryView.classList.contains('hidden-view')) return;
    const fieldWidth = locationList.clientWidth;
    const fieldHeight = locationList.clientHeight;
    if (!fieldWidth || !fieldHeight) return;
    doorMotionItems.forEach((item) => {
      const width = item.element.offsetWidth || 92;
      const height = item.element.offsetHeight || 108;
      const maxX = Math.max(0, fieldWidth - width);
      const maxY = Math.max(0, fieldHeight - height);
      if (item.x === null) item.x = Math.max(0, Math.min(maxX, item.startX * fieldWidth - width / 2));
      if (item.y === null) item.y = Math.max(0, Math.min(maxY, item.startY * fieldHeight - height / 2));
      item.x = Math.max(0, Math.min(maxX, item.x));
      item.y = Math.max(0, Math.min(maxY, item.y));
      updateDoorTilt(item);
      item.element.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
    });
    doorMotionLastTime = performance.now();
    doorMotionFrame = requestAnimationFrame(updateDoorMotion);
  }

  function updateDoorMotion(now) {
    if (state.status !== 'selecting' || categoryView.classList.contains('hidden-view') || backgroundSelector.classList.contains('hidden')) {
      stopDoorMotion();
      return;
    }
    const fieldWidth = locationList.clientWidth;
    const fieldHeight = locationList.clientHeight;
    const dt = Math.min(.05, Math.max(0, (now - doorMotionLastTime) / 1000));
    doorMotionLastTime = now;
    const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    doorMotionItems.forEach((item) => {
      const width = item.element.offsetWidth || 92;
      const height = item.element.offsetHeight || 108;
      const maxX = Math.max(0, fieldWidth - width);
      const maxY = Math.max(0, fieldHeight - height);
      const motionScale = reduceMotion ? .35 : 1;
      item.x += item.vx * dt * motionScale;
      item.y += item.vy * dt * motionScale;
      if (item.x <= 0) { item.x = 0; item.vx = Math.abs(item.vx); setDoorWallTilt(item, 11); }
      else if (item.x >= maxX) { item.x = maxX; item.vx = -Math.abs(item.vx); setDoorWallTilt(item, -11); }
      if (item.y <= 0) { item.y = 0; item.vy = Math.abs(item.vy); setDoorWallTilt(item, item.vx >= 0 ? 9 : -9); }
      else if (item.y >= maxY) { item.y = maxY; item.vy = -Math.abs(item.vy); setDoorWallTilt(item, item.vx >= 0 ? -9 : 9); }
    });
    resolveDoorCollisions(fieldWidth, fieldHeight);
    doorMotionItems.forEach((item) => {
      updateDoorTilt(item, dt);
      item.element.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
    });
    doorMotionFrame = requestAnimationFrame(updateDoorMotion);
  }

  function resolveDoorCollisions(fieldWidth, fieldHeight) {
    for (let pass = 0; pass < 3; pass += 1) {
      for (let i = 0; i < doorMotionItems.length; i += 1) {
        const a = doorMotionItems[i];
        const aw = a.element.offsetWidth || 154;
        const ah = a.element.offsetHeight || 184;
        const ar = Math.min(70, aw * .44);
        const acx = a.x + aw / 2;
        const acy = a.y + Math.min(74, ah * .41);
        for (let j = i + 1; j < doorMotionItems.length; j += 1) {
          const b = doorMotionItems[j];
          const bw = b.element.offsetWidth || 154;
          const bh = b.element.offsetHeight || 184;
          const br = Math.min(70, bw * .44);
          const bcx = b.x + bw / 2;
          const bcy = b.y + Math.min(74, bh * .41);
          let dx = bcx - acx;
          let dy = bcy - acy;
          let distance = Math.hypot(dx, dy);
          const minimumDistance = ar + br;
          if (distance >= minimumDistance) continue;
          if (distance < .001) { dx = 1; dy = 0; distance = 1; }
          const nx = dx / distance;
          const ny = dy / distance;
          const separation = (minimumDistance - distance) / 2 + .5;
          a.x -= nx * separation;
          a.y -= ny * separation;
          b.x += nx * separation;
          b.y += ny * separation;
          const relativeApproach = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (relativeApproach < 0) {
            a.vx += relativeApproach * nx;
            a.vy += relativeApproach * ny;
            b.vx -= relativeApproach * nx;
            b.vy -= relativeApproach * ny;
          }
          a.x = Math.max(0, Math.min(Math.max(0, fieldWidth - aw), a.x));
          a.y = Math.max(0, Math.min(Math.max(0, fieldHeight - ah), a.y));
          b.x = Math.max(0, Math.min(Math.max(0, fieldWidth - bw), b.x));
          b.y = Math.max(0, Math.min(Math.max(0, fieldHeight - bh), b.y));
        }
      }
    }
  }

  function categoryScenes(categoryId) {
    return Array.isArray(BACKGROUND_IMAGES[categoryId]) ? BACKGROUND_IMAGES[categoryId].filter(Boolean) : [];
  }

  function refillPreviewBag(categoryId, avoidSceneId = '') {
    const scenes = categoryScenes(categoryId);
    const indices = scenes.map((_, index) => index);
    for (let i = indices.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    if (avoidSceneId && indices.length > 1 && scenes[indices[0]]?.id === avoidSceneId) {
      [indices[0], indices[1]] = [indices[1], indices[0]];
    }
    previewShuffleBag = indices;
  }

  function nextRandomSceneIndex() {
    const scenes = categoryScenes(activeGalleryCategory);
    if (!scenes.length) return -1;
    const currentId = previewHistoryIndex >= 0 ? scenes[previewHistory[previewHistoryIndex]]?.id : '';
    if (!previewShuffleBag.length) refillPreviewBag(activeGalleryCategory, currentId);
    let index = previewShuffleBag.shift();
    if (scenes.length > 1 && scenes[index]?.id === currentId) {
      if (!previewShuffleBag.length) refillPreviewBag(activeGalleryCategory, currentId);
      index = previewShuffleBag.shift();
    }
    return Number.isFinite(index) ? index : 0;
  }

  function currentPreviewScene() {
    const scenes = categoryScenes(activeGalleryCategory);
    if (previewHistoryIndex < 0 || previewHistoryIndex >= previewHistory.length) return null;
    return scenes[previewHistory[previewHistoryIndex]] || null;
  }

  function renderPreviewScene(scene, direction = 0) {
    if (!scene) {
      previewEmpty.classList.remove('hidden');
      previewImage.removeAttribute('src');
      return;
    }

    previewEmpty.classList.add('hidden');
    previewImage.classList.add('is-changing');
    previewImage.style.filter = scene.image ? 'none' : sceneImageFilter(scene);
    previewImage.style.objectPosition = `${44 + ((Number(scene.seed) || 1) % 13)}% center`;
    previewImage.style.transform = `scale(1.02) translateX(${direction > 0 ? '1.2%' : direction < 0 ? '-1.2%' : '0'})`;

    const source = sceneImageSource(scene);
    let settled = false;
    const settle = () => {
      if (settled) return;
      settled = true;
      requestAnimationFrame(() => {
        previewImage.classList.remove('is-changing');
        previewImage.style.transform = 'scale(1.015) translateX(0)';
      });
    };

    previewImage.onload = settle;
    previewImage.onerror = () => {
      // Embedded image decode failure should never leave the selection screen blank.
      previewImage.onerror = null;
      previewImage.onload = settle;
      previewImage.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(makeLandscapeSvg(scene))}`;
    };
    previewImage.src = source;

    if (previewImage.complete && previewImage.naturalWidth > 0) settle();
    getSceneImage(scene);
  }

  function animatePreviewHints() {
    previewQuestion.classList.remove('play');
    previewArrowLeft.classList.remove('play');
    previewArrowRight.classList.remove('play');
    void previewQuestion.offsetWidth;
    previewQuestion.classList.add('play');
    previewArrowLeft.classList.add('play');
    previewArrowRight.classList.add('play');
  }

  function openBackgroundPreview(categoryId) {
    const category = BACKGROUND_CATEGORIES.find((item) => item.id === categoryId);
    if (!category) return;
    activeGalleryCategory = categoryId;
    previewHistory = [];
    previewHistoryIndex = -1;
    previewShuffleBag = [];
    previewTitle.textContent = category.name;
    const firstIndex = nextRandomSceneIndex();
    if (firstIndex >= 0) {
      previewHistory.push(firstIndex);
      previewHistoryIndex = 0;
      renderPreviewScene(currentPreviewScene(), 0);
    } else {
      renderPreviewScene(null);
    }
    setSelectorView('preview');
    animatePreviewHints();
  }

  function showCategoryView() {
    activeGalleryCategory = '';
    previewHistory = [];
    previewHistoryIndex = -1;
    previewShuffleBag = [];
    doorQuestion.textContent = '어디로 갈까요?';
    categoryView.classList.remove('location-entering');
    categoryGuide.classList.remove('walking-into-location');
    categoryGuide.style.removeProperty('--walk-x');
    categoryGuide.style.removeProperty('--walk-y');
    categoryGuide.src = categoryGuideFrontSource;
    renderLocationList();
    setSelectorView('category');
    categoryView.scrollTop = 0;
  }

  async function playLocationEntryTransition(selectedButton) {
    if (!selectedButton || !categoryGuide) return;
    const guideRect = categoryGuide.getBoundingClientRect();
    const labelRect = selectedButton.getBoundingClientRect();
    const targetX = window.innerWidth / 2;
    const targetY = window.innerHeight * .52;
    const labelDeltaX = targetX - (labelRect.left + labelRect.width / 2);
    const labelDeltaY = targetY - (labelRect.top + labelRect.height / 2);
    selectedButton.style.setProperty('--label-x', `${labelDeltaX}px`);
    selectedButton.style.setProperty('--label-y', `${labelDeltaY}px`);
    selectedButton.classList.add('location-selected');
    categoryView.classList.add('location-entering');
    const deltaX = targetX - (guideRect.left + guideRect.width / 2);
    const deltaY = targetY - (guideRect.top + guideRect.height * .42);
    categoryGuide.style.setProperty('--walk-x', `${deltaX}px`);
    categoryGuide.style.setProperty('--walk-y', `${deltaY}px`);
    if (categoryGuideBackImage.complete && categoryGuideBackImage.naturalWidth > 0) {
      categoryGuide.src = categoryGuideBackSource;
    }
    void categoryGuide.offsetWidth;
    categoryGuide.classList.add('walking-into-location');
    await sleep(3020);
  }

  function showNewPreviewScene() {
    const nextIndex = nextRandomSceneIndex();
    if (nextIndex < 0) return;
    // 뒤로 돌아온 뒤 새 그림을 보면 그 시점부터 새 히스토리를 만듭니다.
    if (previewHistoryIndex < previewHistory.length - 1) previewHistory = previewHistory.slice(0, previewHistoryIndex + 1);
    previewHistory.push(nextIndex);
    previewHistoryIndex = previewHistory.length - 1;
    renderPreviewScene(currentPreviewScene(), 1);
  }

  function showPreviousPreviewScene() {
    if (previewHistoryIndex <= 0) return;
    previewHistoryIndex -= 1;
    renderPreviewScene(currentPreviewScene(), -1);
  }

  function waitForSceneImage(image, timeout = 1200) {
    if (!image || (image.complete && image.naturalWidth > 0)) return Promise.resolve();
    return new Promise((resolve) => {
      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timerId);
        image.removeEventListener?.('load', finish);
        image.removeEventListener?.('error', finish);
        resolve();
      };
      const timerId = window.setTimeout(finish, timeout);
      image.addEventListener?.('load', finish, { once: true });
      image.addEventListener?.('error', finish, { once: true });
    });
  }

  async function selectBackgroundScene(scene = currentPreviewScene()) {
    if (!scene) return;
    startGameBgm({ restart: true });
    stopDoorMotion();
    doorSelectionLocked = true;
    state.selectedCategoryId = activeGalleryCategory;
    state.selectedBackground = scene;
    storage.set('mindscape-selected-background', scene.id || '');
    const sceneImage = getSceneImage(scene);
    await waitForSceneImage(sceneImage);
    newRound({ entrance: true });
    backgroundSelector.classList.add('hidden');
    state.lastTime = performance.now();
  }

  function showBackgroundSelector({ replayIntro = false } = {}) {
    stopGameBgm();
    cancelGameEntrance();
    cancelAim({ restoreFirstPrompt: false });
    hideAllPanels();
    state.status = 'selecting';
    backgroundSelector.classList.remove('hidden');
    if (replayIntro && storage.get(WORLD_INTRO_SEEN_KEY, 'false') !== 'true') introSequencePlayed = false;
    if (!introSequencePlayed) playEntranceSequence();
    else showCategoryView();
  }

  let previewLastTouchAt = 0;

  function handlePreviewSwipeEnd(startX, startY, endX, endY, elapsed) {
    const dx = endX - startX;
    const dy = endY - startY;
    if (Math.abs(dx) < 34 || Math.abs(dx) < Math.abs(dy) * 1.05 || elapsed > 1800) return false;
    // 정의: 오른쪽으로 밀면 새 그림 / 왼쪽으로 밀면 방금 전에 본 그림.
    if (dx > 0) showNewPreviewScene();
    else showPreviousPreviewScene();
    return true;
  }

  function isPreviewControlTarget(target) {
    return Boolean(target?.closest?.('#previewBack, #previewConfirm, #previewArrowLeft, #previewArrowRight'));
  }

  function startPreviewSwipeTouch(event) {
    if (previewView.classList.contains('hidden-view') || isPreviewControlTarget(event.target)) return;
    const touch = event.touches && event.touches[0];
    if (!touch) return;
    previewLastTouchAt = performance.now();
    previewPointer = { kind:'touch', id:touch.identifier, x:touch.clientX, y:touch.clientY, time:performance.now() };
  }

  function endPreviewSwipeTouch(event) {
    if (!previewPointer || previewPointer.kind !== 'touch') return;
    const touches = Array.from(event.changedTouches || []);
    const touch = touches.find((item) => item.identifier === previewPointer.id) || touches[0];
    if (!touch) { previewPointer = null; return; }
    handlePreviewSwipeEnd(previewPointer.x, previewPointer.y, touch.clientX, touch.clientY, performance.now() - previewPointer.time);
    previewPointer = null;
    previewLastTouchAt = performance.now();
  }

  function startPreviewSwipeMouse(event) {
    if (previewView.classList.contains('hidden-view') || isPreviewControlTarget(event.target)) return;
    if (performance.now() - previewLastTouchAt < 800) return;
    if (event.button !== 0) return;
    previewPointer = { kind:'mouse', x:event.clientX, y:event.clientY, time:performance.now() };
  }

  function endPreviewSwipeMouse(event) {
    if (!previewPointer || previewPointer.kind !== 'mouse') return;
    handlePreviewSwipeEnd(previewPointer.x, previewPointer.y, event.clientX, event.clientY, performance.now() - previewPointer.time);
    previewPointer = null;
  }

  function clearPreviewSwipe() {
    previewPointer = null;
  }

  function resizeCanvas() {
    const rect = app.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    state.dpr = dpr;
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    canvas.style.width = `${rect.width}px`;
    canvas.style.height = `${rect.height}px`;
  }

  function toDesignPoint(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) / rect.width * DESIGN_W,
      y: (event.clientY - rect.top) / rect.height * DESIGN_H,
    };
  }

  function cancelGameEntrance() {
    gameEntranceTimers.forEach((timerId) => clearTimeout(timerId));
    gameEntranceTimers = [];
    app.classList.remove('game-entering', 'game-target-visible', 'game-ui-visible', 'game-intro-visible', 'game-aim-visible', 'show-stage-intro');
  }

  function setPullCue(visible) {
    state.pullCueVisible = Boolean(visible);
    controlHint.classList.toggle('pull-cue', state.pullCueVisible);
  }

  function shuffledCopy(values) {
    const result = [...values];
    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function buildShootingPromptQueue() {
    const unlocked = stoaMessageData.filter((item) => Number(item?.firstStage) <= state.stage && item?.message);
    const basic = shuffledCopy(unlocked.filter((item) => item.type === 'basic')).slice(0, 3);
    const selected = shuffledCopy(unlocked.filter((item) => item.type !== 'basic')).slice(0, 3);
    return shuffledCopy([...basic, ...selected]);
  }

  function getStageAimMotion(stage = state.stage) {
    return STAGE_AIM_MOTION[Math.min(3, Math.max(0, Number(stage) - 1))] || STAGE_AIM_MOTION[0];
  }

  function newRound({ entrance = false } = {}) {
    cancelGameEntrance();
    state.shotsLeft = MAX_SHOTS;
    state.score = 0;
    state.streak = 0;
    state.totalHits = 0;
    state.signalHitBubbleCount = 0;
    state.signalMissBubbleCount = 0;
    state.hits = [];
    state.flight = null;
    state.signal = null;
    state.status = entrance ? 'entering' : 'ready';
    state.pointerId = null;
    state.targetGroup = 0;
    state.targetX = getStageTargetX(state.stage, state.targetGroup);
    state.aimX = DESIGN_W / 2;
    const stageMotion = getStageAimMotion();
    state.verticalPhase = random(.44, .56);
    state.verticalSpeed = stageMotion.speed || FIXED_VERTICAL_SPEED;
    const initialPingPong = state.verticalPhase <= 1 ? state.verticalPhase : 2 - state.verticalPhase;
    const initialEased = .5 - .5 * Math.cos(Math.PI * initialPingPong);
    state.aimY = lerp(stageMotion.minY, stageMotion.maxY, initialEased);
    state.aimElapsed = 0;
    state.aimCorrectionX = 0;
    state.aimCorrectionY = 0;
    state.aimVelocityX = 0;
    state.aimVelocityY = 0;
    state.targetEmotionLabelVisible = false;
    state.lastShootingPromptIndex = '';
    state.shootingPromptQueue = buildShootingPromptQueue();
    state.shownEmotionPrompts = [];
    state.targetPulseRemaining = state.stage === 1 ? 1 : 0;
    state.targetPulseTime = -1;
    setPullCue(state.stage === 1 && !entrance);
    controlHint.classList.toggle('hide-aim-guide', state.stage >= 3);
    resetControlInteraction();
    state.shake = 0;
    hideShootingPrompt();
    hideAllPanels();
    tutorial.classList.remove('visible');
    updateHud();
    updateAimGuideDirection();
    if (entrance) {
      state.firstAimTutorialPending = true;
      state.firstAimTutorialActive = false;
      state.postTutorialPromptIndex = 0;
      const showStageIntro = state.stage <= 4;
      stageIntroNumber.textContent = `Stage ${state.stage}`;
      stageIntroCopy.textContent = STAGE_TITLES[Math.min(3, Math.max(0, state.stage - 1))] || '';
      app.classList.add('game-entering');
      app.classList.toggle('show-stage-intro', showStageIntro);
      const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
      const targetDelay = reduceMotion ? 650 : 1000;
      const uiDelay = reduceMotion ? 850 : 1300;
      const readyDelay = reduceMotion ? 2100 : 2800;
      const finishDelay = reduceMotion ? 2400 : 3200;
      gameEntranceTimers.push(window.setTimeout(() => {
        app.classList.add('game-target-visible');
      }, targetDelay));
      gameEntranceTimers.push(window.setTimeout(() => {
        app.classList.add('game-ui-visible', 'game-intro-visible');
        showDoorIntroductionPrompt();
        state.lastTime = performance.now();
      }, uiDelay));
      gameEntranceTimers.push(window.setTimeout(() => {
        state.status = 'ready';
        app.classList.remove('game-intro-visible');
        app.classList.add('game-aim-visible');
        showFirstAimReadyPrompt();
        state.lastTime = performance.now();
      }, readyDelay));
      gameEntranceTimers.push(window.setTimeout(() => {
        app.classList.remove('game-entering', 'game-target-visible', 'game-ui-visible', 'game-intro-visible', 'game-aim-visible', 'show-stage-intro');
        gameEntranceTimers = [];
      }, finishDelay));
    } else showShootingPrompt();
  }

  function updateHud() {
    const title = STAGE_TITLES[Math.min(3, Math.max(0, state.stage - 1))] || STAGE_TITLES[3];
    stageText.textContent = `Stage ${state.stage}. ${title}`;
    const shotsUsed = Math.min(MAX_SHOTS, Math.max(0, MAX_SHOTS - state.shotsLeft));
    shotNumber.textContent = `${shotsUsed}`;
    shotCount.textContent = `${shotsUsed} / ${MAX_SHOTS}`;
  }

  function showMessage(title, detail = '', duration = 1200) {
    tutorial.innerHTML = `<strong>${title}</strong><span>${detail}</span>`;
    tutorial.classList.add('visible');
    clearTimeout(state.messageTimer);
    state.messageTimer = window.setTimeout(() => tutorial.classList.remove('visible'), duration);
  }


  function setFocusPrompt(text) {
    const nextText = String(text || '');
    if (!nextText) return;
    if (focusPrompt.textContent === nextText && focusPrompt.classList.contains('visible')) return;
    if (state.promptSwapTimer) clearTimeout(state.promptSwapTimer);

    if (focusPrompt.classList.contains('visible') && focusPrompt.textContent) {
      focusPrompt.classList.remove('visible');
      state.promptSwapTimer = window.setTimeout(() => {
        focusPrompt.textContent = nextText;
        void focusPrompt.offsetWidth;
        focusPrompt.classList.add('visible');
        state.promptSwapTimer = 0;
      }, 680);
      return;
    }

    focusPrompt.textContent = nextText;
    void focusPrompt.offsetWidth;
    focusPrompt.classList.add('visible');
  }

  function showFirstAimReadyPrompt() {
    if (!state.firstAimTutorialPending) return;
    if (state.stage === 1 && state.shotsLeft === MAX_SHOTS) {
      setPullCue(true);
      setFocusPrompt(firstAimReadyPrompt);
      return;
    }
    showShootingPrompt();
  }

  function objectParticle(word) {
    const lastCode = String(word || '').trim().charCodeAt(String(word || '').trim().length - 1);
    const hasFinalConsonant = lastCode >= 0xAC00 && lastCode <= 0xD7A3 && (lastCode - 0xAC00) % 28 !== 0;
    return hasFinalConsonant ? '을' : '를';
  }

  function showDoorIntroductionPrompt() {
    hideShootingPrompt();
    state.targetEmotionLabelVisible = false;
    setPullCue(true);
  }

  function showShootingPrompt() {
    const shotsUsed = MAX_SHOTS - state.shotsLeft;
    if (state.stage === 1 && !state.firstAimTutorialPending && shotsUsed === 1) {
      setPullCue(true);
      setFocusPrompt('계속 과녁을 맞추세요');
      return;
    }
    const promptOffset = state.stage === 1 && !state.firstAimTutorialPending ? 2 : 0;
    const promptIndex = Math.floor(Math.max(0, shotsUsed - promptOffset) / 2);
    const item = state.shootingPromptQueue[promptIndex];
    if (!item?.message) return;
    if (item.type !== 'basic' && !state.shownEmotionPrompts.includes(item.message)) {
      state.shownEmotionPrompts.push(item.message);
    }
    state.lastShootingPromptIndex = item.message;
    setFocusPrompt(item.message);
  }

  function hideShootingPrompt(immediate = false) {
    if (state.promptSwapTimer) clearTimeout(state.promptSwapTimer);
    state.promptSwapTimer = 0;
    focusPrompt.classList.remove('visible');
    if (immediate) focusPrompt.textContent = '';
  }

  function hideAllPanels() {
    pausePanel.classList.add('hidden');
    journalPanel.classList.add('hidden');
    resultPanel.classList.add('hidden');
    lifeJournalPanel?.classList.add('hidden');
    collectionPanel?.classList.add('hidden');
    failPanel.classList.add('hidden');
  }

  function openJournal(fromStatus = state.status, startup = false) {
    cancelAim({ restoreFirstPrompt: false });
    state.previousStatus = fromStatus;
    state.journalStartup = startup;
    hideAllPanels();
    tutorial.classList.remove('visible');
    state.status = 'journal';
    journalPanel.classList.toggle('startup-minimal', startup);

    if (startup) {
      journalQuote.textContent = startupJournalMessage;
      journalCaption.textContent = '';
    } else {
      const count = journalEntries.length;
      state.journalEntryIndex = count > 0 ? Math.floor(Math.random() * count) : 0;
      journalQuote.textContent = count > 0
        ? journalEntries[state.journalEntryIndex]
        : '아직 기록된 문장이 없습니다.';
      journalCaption.textContent = count > 1
        ? `${state.journalEntryIndex + 1} / ${count}`
        : '오늘의 기록';
    }
    journalPanel.classList.remove('hidden');
  }

  function closeJournal() {
    journalPanel.classList.add('hidden');
    if (state.journalStartup) {
      state.journalStartup = false;
      state.status = 'ready';
      state.lastTime = performance.now();
      tutorial.classList.remove('visible');
      showFirstAimReadyPrompt();
      return;
    }

    if (state.previousStatus === 'paused') {
      state.status = 'paused';
      pausePanel.classList.remove('hidden');
    } else if (state.previousStatus === 'result') {
      state.status = 'result';
      resultPanel.classList.remove('hidden');
    } else {
      state.status = 'ready';
      state.lastTime = performance.now();
    }
  }

  function resetControlInteraction() {
    state.dragStartX = 0;
    state.dragStartY = 0;
    state.dragX = 0;
    state.dragY = 0;
  }

  function startAim(event) {
    if (!['ready'].includes(state.status)) return;
    if (event.target !== canvas) return;
    if (event.isPrimary === false || state.pointerId !== null) return;
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    initAudio();
    resumeGameBgm();
    event.preventDefault();
    try { canvas.setPointerCapture?.(event.pointerId); } catch (_) {}
    const p = toDesignPoint(event);
    state.pointerId = event.pointerId;
    state.status = 'aiming';
    state.holdStart = performance.now();
    setPullCue(false);
    const isFirstStageFirstAim = state.stage === 1
      && state.shotsLeft === MAX_SHOTS
      && state.firstAimTutorialPending;
    if (state.stage === 1 && state.targetPulseRemaining > 0) {
      state.targetPulseRemaining -= 1;
      state.targetPulseTime = 0;
    }
    state.dragStartX = p.x;
    state.dragStartY = p.y;
    state.dragX = p.x;
    state.dragY = p.y;
    state.aimX = clamp(p.x, 38, DESIGN_W - 38);
    tutorial.classList.remove('visible');
    if (state.firstAimTutorialPending) {
      state.firstAimTutorialActive = true;
    }
    if (isFirstStageFirstAim) hideShootingPrompt(true);
    else showShootingPrompt();
    updateAimGuideDirection();
    controlHint.classList.add('aiming');
  }

  function moveAim(event) {
    if (state.status !== 'aiming' || event.pointerId !== state.pointerId) return;
    event.preventDefault();
    const p = toDesignPoint(event);
    state.dragX = p.x;
    state.dragY = p.y;
    state.aimX += (clamp(p.x, 38, DESIGN_W - 38) - state.aimX) * .52;
    updateAimGuideDirection();
  }

  function releaseAim(event) {
    if (state.status !== 'aiming' || event.pointerId !== state.pointerId) return;
    event.preventDefault();
    const pointerId = state.pointerId;
    state.pointerId = null;
    try { canvas.releasePointerCapture?.(pointerId); } catch (_) {}
    if (state.firstAimTutorialActive) {
      state.firstAimTutorialActive = false;
      state.firstAimTutorialPending = false;
    }
    controlHint.classList.remove('aiming');
    resetControlInteraction();
    shootArrow();
    updateAimGuideDirection();
  }

  function cancelAim({ restoreFirstPrompt = true, pointerId = state.pointerId } = {}) {
    if (state.status === 'aiming') {
      controlHint.classList.remove('aiming');
      state.pointerId = null;
      try { if (pointerId !== null) canvas.releasePointerCapture?.(pointerId); } catch (_) {}
      state.firstAimTutorialActive = false;
      state.status = 'ready';
      resetControlInteraction();
      updateAimGuideDirection();
      if (restoreFirstPrompt && state.firstAimTutorialPending) showFirstAimReadyPrompt();
    }
  }

  function shootArrow() {
    state.status = 'flying';
    state.shotsLeft = Math.max(0, state.shotsLeft - 1);
    const target = getTargetGeometry();
    const endX = state.aimX;
    const endY = state.aimY;
    const hit = scoreHit(endX, endY, target);
    state.flight = {
      t: 0,
      duration: 0.72,
      startX: DESIGN_W / 2,
      startY: 712,
      endX,
      endY,
      hit,
    };
    playRelease();
    updateHud();
  }

  function scoreHit(x, y, target) {
    const dx = (x - target.cx) / target.rx;
    const dy = (y - target.cy) / target.ry;
    const normalized = Math.sqrt(dx * dx + dy * dy);
    let points = 0;
    let label = '빗나감';
    if (normalized <= 0.18) { points = 100; label = '정중앙'; }
    else if (normalized <= 0.38) { points = 70; label = '정확'; }
    else if (normalized <= 0.66) { points = 40; label = '명중'; }
    else if (normalized <= 1) { points = 20; label = '과녁 끝'; }
    const mark = points >= 70 ? '○' : points > 0 ? '△' : '×';
    const signalType = normalized <= 0.52 ? 'hit' : points > 0 ? 'near' : 'miss';
    return { x, y, points, label, normalized, mark, signalType };
  }

  function finishFlight() {
    const hit = state.flight.hit;
    const success = hit.points > 0;
    state.hits.push(hit);
    state.score += hit.points;
    if (success) {
      state.streak += 1;
      state.totalHits += 1;
    } else state.streak = 0;
    state.shake = success ? 1.3 : 0.4;
    updateHud();
    state.flight = null;
    const bubbleCounterKey = hit.signalType === 'hit'
      ? 'signalHitBubbleCount'
      : hit.signalType === 'miss' ? 'signalMissBubbleCount' : '';
    const showBubble = Boolean(bubbleCounterKey) && state[bubbleCounterKey] < 3;
    if (showBubble) state[bubbleCounterKey] += 1;
    state.signal = {
      t: 0,
      duration: 1.45,
      success,
      type: hit.signalType,
      label: hit.label,
      points: hit.points,
      showBubble,
    };
    state.status = 'signaling';
  }

  function finishSignal() {
    const signal = state.signal;
    state.signal = null;
    if (!signal) {
      state.status = 'ready';
      return;
    }

    if (state.shotsLeft <= 0) {
      hideShootingPrompt();
      tutorial.classList.remove('visible');
      showResult();
      return;
    }

    const shotsUsed = MAX_SHOTS - state.shotsLeft;
    if (shotsUsed > 0 && shotsUsed % 3 === 0) {
      state.targetGroup = (state.targetGroup + 1) % 4;
      state.targetX = getStageTargetX(state.stage, state.targetGroup);
    }
    state.status = 'ready';
    updateAimGuideDirection();
    setPullCue(state.stage === 1 && shotsUsed < 3 && state.targetPulseRemaining > 0);
    showShootingPrompt();
  }

  function showResult() {
    state.status = 'result';
    state.best = Math.max(state.best, state.score);
    storage.set('joseon-archery-best', state.best);
    finalScore.textContent = `${state.score}점`;
    bestScore.textContent = `최고 기록 ${state.best}점`;
    if (state.score >= 1000) resultTitle.textContent = '흔들림 없는 열두 발';
    else if (state.score >= 720) resultTitle.textContent = '고요를 붙잡았습니다';
    else if (state.score >= 360) resultTitle.textContent = '호흡을 읽었습니다';
    else resultTitle.textContent = '다시, 한 번의 호흡';
    renderResultSheet();
    state.resultEmotionMessage = '';
    renderResultMessageChoices();
    resultCardStage.classList.add('hidden');
    resultConfirmButton.classList.add('hidden');
    resultPanel.querySelector('.result-panel')?.classList.add('message-selecting');
    resultPanel.querySelector('.result-panel')?.classList.remove('postcard-selected');
    resultPanel.classList.remove('hidden');
  }

  function renderResultSheet() {
    resultSheet.innerHTML = '';
    state.hits.forEach((hit, index) => {
      const cell = document.createElement('div');
      const symbolClass = hit.mark === '○' ? 'circle' : hit.mark === '△' ? 'triangle' : 'miss';
      cell.className = 'result-shot';
      cell.innerHTML = `<span class="result-shot-number">${index + 1}</span><span class="result-symbol ${symbolClass}">${hit.mark}</span>`;
      resultSheet.appendChild(cell);
    });
  }

  function selectStageEmotionMessage() {

    return messages.length
      ? messages[Math.floor(Math.random() * messages.length)]
      : '지금의 마음을 바라본 것만으로도\n한 걸음 앞으로 나아갔습니다.';
