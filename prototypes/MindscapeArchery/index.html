  function drawPostcardText(context, text, width, height) {
    const paragraphs = String(text || '').split('\n');
    const lines = [];
    context.font = '600 49px "Noto Sans KR", sans-serif';
    paragraphs.forEach((paragraph) => {
      let line = '';
      [...paragraph].forEach((char) => {
        const candidate = line + char;
        if (context.measureText(candidate).width > width * .76 && line) {
          lines.push(line);
          line = char;
        } else line = candidate;
      });
      if (line) lines.push(line);
    });
    const lineHeight = 62;
    const startY = height / 2 - (lines.length - 1) * lineHeight / 2;
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.fillStyle = 'rgba(47, 47, 58, .88)';
    context.shadowColor = 'rgba(255,255,255,.65)';
    context.shadowBlur = 10;
    lines.forEach((line, index) => context.fillText(line, width / 2, startY + index * lineHeight));
    context.shadowBlur = 0;
  }

  function paintPostcardCanvas(canvasElement, message, scene) {
    const postcardCtx = canvasElement.getContext('2d');
    const width = canvasElement.width;
    const height = canvasElement.height;
    const image = scene?.image ? getSceneImage(scene) : sceneBackground;

    const paint = () => {
      postcardCtx.clearRect(0, 0, width, height);
      postcardCtx.fillStyle = '#e9e9ed';
      postcardCtx.fillRect(0, 0, width, height);
      if (image.complete && image.naturalWidth > 0) {
        const targetAspect = width / height;
        const imageAspect = image.naturalWidth / image.naturalHeight;
        const cropWidth = imageAspect > targetAspect ? image.naturalHeight * targetAspect : image.naturalWidth;
        const cropHeight = imageAspect > targetAspect ? image.naturalHeight : image.naturalWidth / targetAspect;
        const seed = (Number(scene?.seed) || state.stage || 1) % 17 / 17;
        const cropX = Number.isFinite(Number(scene?.cropX)) ? clamp(Number(scene.cropX), 0, 1) : seed;
        const cropY = Number.isFinite(Number(scene?.cropY)) ? clamp(Number(scene.cropY), 0, 1) : 1 - seed;
        const sx = (image.naturalWidth - cropWidth) * cropX;
        const sy = (image.naturalHeight - cropHeight) * cropY;
        postcardCtx.drawImage(image, sx, sy, cropWidth, cropHeight, 0, 0, width, height);
      }
      const veil = postcardCtx.createLinearGradient(0, 0, 0, height);
      veil.addColorStop(0, 'rgba(255,255,255,.18)');
      veil.addColorStop(.48, 'rgba(255,255,255,.55)');
      veil.addColorStop(1, 'rgba(255,255,255,.30)');
      postcardCtx.fillStyle = veil;
      postcardCtx.fillRect(0, 0, width, height);
      drawPostcardText(postcardCtx, message, width, height);
      postcardCtx.font = '500 20px "Noto Sans KR", sans-serif';
      postcardCtx.textAlign = 'center';
      postcardCtx.fillStyle = 'rgba(53,53,65,.58)';
      const now = new Date();
      const dateText = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
      postcardCtx.fillText(dateText, width / 2, height - 54);
    };

    paint();
    if (!image.complete) image.addEventListener('load', paint, { once: true });
  }

  function renderEmotionPostcard(message, scene = state.selectedBackground) {
    paintPostcardCanvas(emotionPostcard, message, scene);
  }

  function getCardCollection() {
    try {
      const parsed = JSON.parse(storage.get(CARD_COLLECTION_KEY, '[]'));
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
      return [];
    }
  }

  function saveCardCollection(records) {
    storage.set(CARD_COLLECTION_KEY, JSON.stringify(records));
  }

  function collectionSceneSnapshot(scene) {
    if (!scene) return null;
    return {
      id: scene.id || '', title: scene.title || '', image: scene.image || '', theme: scene.theme || '',
      seed: Number(scene.seed) || 1, palette: Array.isArray(scene.palette) ? scene.palette : [], fantasy: Boolean(scene.fantasy),
      cropX: Number.isFinite(Number(scene.cropX)) ? Number(scene.cropX) : undefined,
      cropY: Number.isFinite(Number(scene.cropY)) ? Number(scene.cropY) : undefined
    };
  }

  function collectResultCard(message, selectedScene = state.selectedBackground) {
    const emotion = state.selectedEmotion || '마음';
    const records = getCardCollection();
    let record = records.find((item) => item.emotion === emotion && item.message === message);
    const scene = collectionSceneSnapshot(selectedScene);
    if (!record) {
      record = {
        id: globalThis.crypto?.randomUUID?.() || `card-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        emotion, message, selectionCount: 0, backgrounds: [], updatedAt: ''
      };
      records.push(record);
    }
    record.selectionCount = (Number(record.selectionCount) || 0) + 1;
    record.updatedAt = new Date().toISOString();
    if (scene && !record.backgrounds.some((item) => item.id === scene.id && item.image === scene.image
      && item.cropX === scene.cropX && item.cropY === scene.cropY)) {
      record.backgrounds.push(scene);
    }
    saveCardCollection(records);
  }

  const collectionCardIndexes = new Map();

  function renderCollectionCards() {
    const records = getCardCollection()
      .sort((a, b) => (Date.parse(b.updatedAt) || 0) - (Date.parse(a.updatedAt) || 0));
    collectionCardList.innerHTML = '';
    collectionEmpty.hidden = records.length > 0;
    records.forEach((record) => {
      const card = document.createElement('article');
      card.className = 'collection-card';
      card.dataset.collectionCardId = record.id;
      const count = Number(record.selectionCount) || 1;
      if (count > 1) {
        const duplicate = document.createElement('p');
        duplicate.className = 'collection-duplicate';
        duplicate.textContent = `내가 ${count}번 선택한 문장입니다.`;
        card.appendChild(duplicate);
      }
      const canvasElement = document.createElement('canvas');
      canvasElement.className = 'collection-card-canvas';
      canvasElement.width = 960;
      canvasElement.height = 600;
      card.appendChild(canvasElement);
      const backgrounds = Array.isArray(record.backgrounds) ? record.backgrounds : [];
      const index = clamp(collectionCardIndexes.get(record.id) || 0, 0, Math.max(0, backgrounds.length - 1));
      collectionCardIndexes.set(record.id, index);
      paintPostcardCanvas(canvasElement, record.message, backgrounds[index] || null);
      if (backgrounds.length > 1) {
        const nav = document.createElement('div');
        nav.className = 'collection-card-nav';
        nav.innerHTML = `<button type="button" data-card-nav="-1" aria-label="이전 배경">‹</button><span>${index + 1} / ${backgrounds.length}</span><button type="button" data-card-nav="1" aria-label="다음 배경">›</button>`;
        card.appendChild(nav);
      }
      collectionCardList.appendChild(card);
    });
  }

  function openCollection() {

    if (state.status === 'aiming') cancelAim({ restoreFirstPrompt: false });

  function changeCollectionCardBackground(recordId, direction) {

    const length = record?.backgrounds?.length || 0;
    if (length < 2) return;
    const current = collectionCardIndexes.get(recordId) || 0;
    collectionCardIndexes.set(recordId, (current + direction + length) % length);
    renderCollectionCards();
  }

  function openPause() {
    if (state.status === 'selecting' || state.status === 'entering' || state.status === 'result' || state.status === 'journal' || state.status === 'life-journal' || state.status === 'collection' || state.status === 'failed') return;
    initAudio();
    state.previousStatus = state.status === 'aiming' ? 'ready' : state.status;
    cancelAim({ restoreFirstPrompt: false });
    state.status = 'paused';
    pausePanel.classList.remove('hidden');

  function resume() {
    pausePanel.classList.add('hidden');
    state.status = ['ready', 'flying', 'signaling'].includes(state.previousStatus) ? state.previousStatus : 'ready';
    state.lastTime = performance.now();
    if (state.status === 'ready') showShootingPrompt();
  }

  function toggleSound() {
    state.muted = !state.muted;
    storage.set('joseon-archery-muted', state.muted);
    soundButton.textContent = state.muted ? '소리 켜기' : '소리 끄기';
    if (bgm) bgm.muted = state.muted;
    if (!state.muted) {
      initAudio();
      resumeGameBgm();
      playMenuTap();
    }
  }

  const targetPatterns = [
    [0.12, 0.76, 0.34, 0.88],
    [0.82, 0.24, 0.66, 0.40],
    [0.20, 0.86, 0.52, 0.30],
    [0.70, 0.16, 0.90, 0.44],
  ];

  function getStageTargetX(stage, group = 0) {
    const minX = 70;
    const maxX = 320;
    const pattern = targetPatterns[(Math.max(1, stage) - 1) % targetPatterns.length];
    const cycle = Math.floor((Math.max(1, stage) - 1) / targetPatterns.length);
    const subtleDrift = ((cycle % 3) - 1) * 0.025;
    const normalized = clamp(pattern[group % 4] + subtleDrift, 0.08, 0.92);
    return lerp(minX, maxX, normalized);
  }

  function updateAimGuideDirection() {
    if (!aimGuide) return;
    let angle = 0;
    if (state.status === 'aiming') {
      const guideBaseX = DESIGN_W / 2;
      const guideBaseY = 665;
      const dx = state.aimX - guideBaseX;
      const dy = Math.max(80, guideBaseY - state.aimY);
      angle = clamp(Math.atan2(dx, dy) * 180 / Math.PI, -32, 32);
    }
    aimGuide.style.setProperty('--aim-angle', `${angle.toFixed(2)}deg`);
  }

  function getTargetGeometry() {
    const scale = Math.max(0.70, 1 - (state.stage - 1) * 0.019);
    return {
      cx: state.targetX,
      cy: DESIGN_H * 0.25,
      rx: 22 * scale,
      ry: 22 * scale,
      visualRadius: 5.4 * scale,
      scale,
    };
  }

  function update(dt) {
    if (state.status === 'aiming') {
      state.verticalPhase = (state.verticalPhase + dt * state.verticalSpeed) % 2;
      const pingPong = state.verticalPhase <= 1 ? state.verticalPhase : 2 - state.verticalPhase;
      const eased = .5 - .5 * Math.cos(Math.PI * pingPong);
      const stageMotion = getStageAimMotion();
      state.aimY = lerp(stageMotion.minY, stageMotion.maxY, eased);
      updateAimGuideDirection();
    }

    if (state.status === 'flying' && state.flight) {
      state.flight.t += dt;
      if (state.flight.t >= state.flight.duration) finishFlight();
    }

    if (state.status === 'signaling' && state.signal) {
      state.signal.t += dt;
      if (state.signal.t >= state.signal.duration) finishSignal();
    }

    if (state.targetPulseTime >= 0) {
      state.targetPulseTime += dt;
      if (state.targetPulseTime >= .72) state.targetPulseTime = -1;
    }

    if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 12);
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    const sx = rect.width / DESIGN_W;
    const sy = rect.height / DESIGN_H;
    ctx.setTransform(state.dpr * sx, 0, 0, state.dpr * sy, 0, 0);
    ctx.clearRect(0, 0, DESIGN_W, DESIGN_H);

    ctx.save();
    if (state.shake > 0) {
      ctx.translate(random(-state.shake, state.shake), random(-state.shake, state.shake));
    }
    drawScene();
    drawControlHint();
    if (state.status === 'aiming') drawAim();
    if (state.flight) drawFlyingLight();
    if (state.signal) drawSignalman();
    ctx.restore();

    if (state.status === 'paused' || state.status === 'journal' || state.status === 'result' || state.status === 'life-journal' || state.status === 'failed') {
      drawStillnessVeil();
    }
  }

  function drawScene() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);

    const selectedScene = state.selectedBackground;
    const activeBackground = selectedScene?.image ? getSceneImage(selectedScene) : sceneBackground;
    if (activeBackground.complete && activeBackground.naturalWidth > 0) {
      const iw = activeBackground.naturalWidth;
      const ih = activeBackground.naturalHeight;
      const scale = Math.max(DESIGN_W / iw, DESIGN_H / ih) * (selectedScene?.image ? 1 : 1.025);
      const dw = iw * scale;
      const dh = ih * scale;
      const drift = selectedScene?.image ? 0 : (((Number(selectedScene?.seed) || 1) % 17) - 8) * 1.25;
      const dx = (DESIGN_W - dw) / 2 + drift;
      const dy = (DESIGN_H - dh) / 2;
      ctx.drawImage(activeBackground, dx, dy, dw, dh);
      if (selectedScene?.palette?.[0]) {
        const wash = ctx.createRadialGradient(DESIGN_W * .72, DESIGN_H * .36, 0, DESIGN_W * .72, DESIGN_H * .36, DESIGN_W * .78);
        wash.addColorStop(0, hexToRgba(selectedScene.palette[0], selectedScene.fantasy ? .075 : .045));
        wash.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = wash;
        ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);
      }
      ctx.fillStyle = 'rgba(255,255,255,0.045)';
      ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);
    } else {
      const paper = ctx.createLinearGradient(0, 0, 0, DESIGN_H);
      paper.addColorStop(0, '#ffffff');
      paper.addColorStop(1, '#f9fafb');
      ctx.fillStyle = paper;
      ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);
    }

    if (state.status !== 'entering' || app.classList.contains('game-target-visible')) drawTarget();
  }

  function drawMistGlow(x, y, radius, color) {
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
    gradient.addColorStop(0, color);
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawInkMountainLayer(baseY, points, color, alpha, roughness) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i += 1) {
      const prev = points[i - 1];
      const curr = points[i];
      const mx = (prev[0] + curr[0]) / 2;
      const my = (prev[1] + curr[1]) / 2;
      ctx.quadraticCurveTo(prev[0], prev[1], mx, my);
    }
    const last = points[points.length - 1];
    ctx.lineTo(last[0], last[1]);
    ctx.lineTo(DESIGN_W, baseY + 95);
    ctx.lineTo(0, baseY + 95);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = alpha * 0.44;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.15;
    for (let pass = 0; pass < 3; pass += 1) {
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1] + pass * roughness * 1.4);
      for (let i = 1; i < points.length; i += 1) {
        const p = points[i];
        ctx.lineTo(p[0], p[1] + Math.sin(i * 2.3 + pass) * roughness * 2.2);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawTarget() {
    const t = getTargetGeometry();
    const pulseProgress = state.targetPulseTime >= 0 ? clamp(state.targetPulseTime / .72, 0, 1) : 0;
    const pulseStrength = state.targetPulseTime >= 0 ? Math.sin(pulseProgress * Math.PI) : 0;
    ctx.save();
    ctx.translate(t.cx, t.cy);
    if (pulseStrength > 0) {
      const haloRadius = 9 + pulseStrength * 14;
      const halo = ctx.createRadialGradient(0, 0, 1, 0, 0, haloRadius);
      halo.addColorStop(0, `rgba(181,72,69,${(.20 * pulseStrength).toFixed(3)})`);
      halo.addColorStop(.48, `rgba(181,72,69,${(.10 * pulseStrength).toFixed(3)})`);
      halo.addColorStop(1, 'rgba(181,72,69,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(0, 0, haloRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.scale(1 + pulseStrength * .58, 1 + pulseStrength * .58);
    }

    // 원래의 붉은 먹점을 모든 감정에서 공통 과녁으로 사용합니다.
    const r = t.visualRadius;
    const targetColors = ORIGINAL_TARGET_COLORS;
    const targetGradient = ctx.createRadialGradient(-r * 0.22, -r * 0.18, r * 0.4, 0, 0, r * 1.15);
    targetGradient.addColorStop(0, targetColors[0]);
    targetGradient.addColorStop(0.72, targetColors[1]);
    targetGradient.addColorStop(1, targetColors[2]);
    ctx.fillStyle = targetGradient;
    ctx.beginPath();
    ctx.moveTo(-r * 0.95, -r * 0.10);
    ctx.bezierCurveTo(-r * 0.70, -r * 0.92, r * 0.30, -r * 1.05, r * 0.93, -r * 0.25);
    ctx.bezierCurveTo(r * 1.12, r * 0.44, r * 0.36, r * 1.02, -r * 0.48, r * 0.84);
    ctx.bezierCurveTo(-r * 1.05, r * 0.54, -r * 1.16, r * 0.12, -r * 0.95, -r * 0.10);
    ctx.fill();

    ctx.globalAlpha = 0.28;
    ctx.fillStyle = targetColors[3];
    for (let i = 0; i < 4; i += 1) {
      ctx.beginPath();
      ctx.arc(Math.sin(i * 2.8) * r * 0.78, Math.cos(i * 1.7) * r * 0.68, 0.7 + (i % 2) * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    if (state.stage === 1 && state.shotsLeft === MAX_SHOTS && state.firstAimTutorialActive) {
      const placeLeft = t.cx > DESIGN_W * .58;
      ctx.save();
      ctx.font = '500 10px "Noto Sans KR", sans-serif';
      ctx.textAlign = placeLeft ? 'right' : 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(161, 54, 51, .94)';
      ctx.shadowColor = 'rgba(255, 255, 255, .86)';
      ctx.shadowBlur = 5;
      ctx.fillText(firstAimHoldPrompt, t.cx + (placeLeft ? -12 : 12), t.cy + 1);
      ctx.restore();
    }

  }

  function traceWaterBlob(rx, ry, sideWobble, scale = 1, offsetX = 0, offsetY = 0, wobbleMul = 1) {
    const x = rx * scale;
    const y = ry * scale;
    const w = sideWobble * wobbleMul;
    ctx.beginPath();
    ctx.moveTo(offsetX, offsetY - y);
    ctx.bezierCurveTo(offsetX + x * .58 + w * 1.45, offsetY - y * .98, offsetX + x * 1.04, offsetY - y * .42 + w * .45, offsetX + x * .93, offsetY + y * .02);
    ctx.bezierCurveTo(offsetX + x * 1.02 - w * .2, offsetY + y * .49, offsetX + x * .47 + w * .55, offsetY + y * .98, offsetX + w * .18, offsetY + y);
    ctx.bezierCurveTo(offsetX - x * .52 + w * .15, offsetY + y * .97, offsetX - x * 1.02, offsetY + y * .46 - w * .3, offsetX - x * .91, offsetY - y * .02);
    ctx.bezierCurveTo(offsetX - x * 1.04 + w * .2, offsetY - y * .48, offsetX - x * .50 - w * .75, offsetY - y * .96, offsetX, offsetY - y);
    ctx.closePath();
  }

  function drawWaterBlobSurface({ rx, ry, wobble, palette, highlightAlpha = .64 }) {
    ctx.save();
    ctx.filter = `blur(${palette.outerBlur || 5.2}px)`;
    traceWaterBlob(rx, ry, wobble, 1.08, 0, 1, .7);
    const outerWash = ctx.createRadialGradient(-5, -8, 3, 0, 1, Math.max(rx, ry) * 1.42);
    outerWash.addColorStop(0, palette.outer[0]);
    outerWash.addColorStop(.42, palette.outer[1]);
    outerWash.addColorStop(.72, palette.outer[2]);
    outerWash.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = outerWash;
    ctx.fill();
    ctx.restore();

    traceWaterBlob(rx, ry, wobble);
    const glass = ctx.createLinearGradient(-rx, -ry, rx, ry);
    palette.glass.forEach(([stop, color]) => glass.addColorStop(stop, color));
    ctx.fillStyle = glass;
    ctx.fill();

    ctx.save();
    ctx.filter = `blur(${palette.pigmentBlur || 3.4}px)`;
    palette.pigments.forEach(([px, py, radius, color], index) => {
      const scale = Math.min(rx / 20.5, ry / 25.5);
      const x = px * scale;
      const y = py * scale;
      const r = radius * scale;
      const pigment = ctx.createRadialGradient(x, y, .5, x, y, r);
      pigment.addColorStop(0, color);
      pigment.addColorStop(.56, color.replace(/0\.(\d+)\)/, '0.040)'));
      pigment.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = pigment;
      ctx.beginPath();
      ctx.ellipse(x, y, r * (.85 + (index % 2) * .12), r, wobble * .08, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    if (highlightAlpha > 0) {
      const scale = Math.min(rx / 20.5, ry / 25.5);
      ctx.strokeStyle = palette.highlight || `rgba(255,255,255,${highlightAlpha})`;
      ctx.lineWidth = 1.55 * scale;
      ctx.beginPath();
      ctx.arc(-6.2 * scale, -9.2 * scale, 7.4 * scale, 3.52, 4.74);
      ctx.stroke();
    }
  }

  const AIM_WATER_PALETTE = {
    outer: ['rgba(156,139,211,0.126)', 'rgba(118,184,214,0.090)', 'rgba(133,204,195,0.066)'],
    glass: [[0, 'rgba(170,155,221,0.126)'], [.28, 'rgba(137,181,222,0.090)'], [.57, 'rgba(139,211,202,0.072)'], [.79, 'rgba(191,166,221,0.094)'], [1, 'rgba(255,255,255,0.042)']],
    pigments: [[-7.5,-8,12,'rgba(145,124,214,0.126)'], [7.2,-1,13,'rgba(103,177,221,0.108)'], [-3,10.5,13.8,'rgba(101,199,190,0.090)'], [6,11,10.5,'rgba(187,145,211,0.086)']],
  };

  const CONTROL_WATER_PALETTE = {
    outer: ['rgba(126,158,211,0.142)', 'rgba(103,173,218,0.102)', 'rgba(116,194,198,0.072)'],
    glass: [[0, 'rgba(130,145,216,0.142)'], [.28, 'rgba(102,166,224,0.112)'], [.57, 'rgba(105,196,204,0.086)'], [.79, 'rgba(146,139,211,0.096)'], [1, 'rgba(255,255,255,0.035)']],
    pigments: [[-7.5,-8,12,'rgba(111,126,211,0.138)'], [7.2,-1,13,'rgba(79,164,222,0.120)'], [-3,10.5,13.8,'rgba(78,190,194,0.096)'], [6,11,10.5,'rgba(145,124,207,0.088)']],
    highlight: 'rgba(207,231,246,.24)',
  };

  function drawControlHint() {
    if (!['ready', 'aiming', 'flying', 'signaling'].includes(state.status)) return;

    {
      const now = performance.now();
      const pressed = state.status === 'aiming';
      const targetX = pressed ? clamp((state.dragX - state.dragStartX) / 105, -1, 1) : 0;
      const targetY = pressed ? clamp((state.dragY - state.dragStartY) / 105, -1, 1) : 0;
      state.controlPressVisual += ((pressed ? 1 : 0) - state.controlPressVisual) * .14;
      state.controlPullVisualX += (targetX - state.controlPullVisualX) * .18;
      state.controlPullVisualY += (targetY - state.controlPullVisualY) * .18;

      const length = Math.hypot(state.controlPullVisualX, state.controlPullVisualY);
      const amount = clamp(length, 0, 1);
      const angle = length > .002 ? Math.atan2(state.controlPullVisualY, state.controlPullVisualX) : 0;
      const press = state.controlPressVisual;
      const wobble = Math.sin(now * .0061) * (2.2 + amount * 2.4);

      ctx.save();
      ctx.translate(DESIGN_W / 2, 712);
      if (state.pullCueVisible && state.stage === 1 && !pressed) {
        const pulse = (now % 1650) / 1650;
        const breathe = .5 + Math.sin(now * .0042) * .5;
        const cueHalo = ctx.createRadialGradient(0, 2, 12, 0, 2, 88 + breathe * 7);
        cueHalo.addColorStop(0, 'rgba(72,130,190,.25)');
        cueHalo.addColorStop(.48, 'rgba(62,116,177,.16)');
        cueHalo.addColorStop(.76, 'rgba(255,255,255,.18)');
        cueHalo.addColorStop(1, 'rgba(46,92,151,0)');
        ctx.fillStyle = cueHalo;
        ctx.beginPath();
        ctx.ellipse(0, 2, 91 + breathe * 7, 101 + breathe * 7, 0, 0, Math.PI * 2);
        ctx.fill();
        for (let index = 0; index < 3; index += 1) {
          const phase = (pulse + index / 3) % 1;
          const radiusX = 47 + phase * 48;
          const radiusY = 57 + phase * 46;
          const alpha = .44 * (1 - phase);
          ctx.strokeStyle = `rgba(45,102,169,${alpha.toFixed(3)})`;
          ctx.lineWidth = 2.2 - phase * .8;
          ctx.beginPath();
          ctx.ellipse(0, 2, radiusX, radiusY, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = `rgba(255,255,255,${(alpha * .62).toFixed(3)})`;
          ctx.lineWidth = .9;
          ctx.beginPath();
          ctx.ellipse(0, 2, radiusX + 2.2, radiusY + 2.2, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.rotate(angle);
      ctx.translate(amount * 14, 0);
      ctx.scale(1 + amount * .66 + press * .10, 1 - amount * .09 + press * .035);
      drawWaterBlobSurface({
        rx: 41,
        ry: 51,
        wobble,
        palette: CONTROL_WATER_PALETTE,
        highlightAlpha: .24,
      });
      ctx.restore();
      return;
    }

    const now = performance.now();
    const pressed = state.status === 'aiming';
    const targetPullX = pressed ? clamp((state.dragX - state.dragStartX) / 105, -1, 1) : 0;
    const targetPullY = pressed ? clamp((state.dragY - state.dragStartY) / 105, -1, 1) : 0;
    state.controlPressVisual += ((pressed ? 1 : 0) - state.controlPressVisual) * .14;
    state.controlPullVisualX += (targetPullX - state.controlPullVisualX) * .18;
    state.controlPullVisualY += (targetPullY - state.controlPullVisualY) * .18;

    const pullLength = Math.hypot(state.controlPullVisualX, state.controlPullVisualY);
    const pullAmount = clamp(pullLength, 0, 1);
    const pullAngle = pullLength > .002
      ? Math.atan2(state.controlPullVisualY, state.controlPullVisualX)
      : 0;
    const press = state.controlPressVisual;
    const breathe = Math.sin(now * 0.0038);
    const wobble = Math.sin(now * 0.0061) * (1.1 + pullAmount * 1.6);
    const baseRx = 41 * (1 + press * .14 + breathe * .008);
    const ry = 51 * (1 + press * .04 - pullAmount * .09);
    const leftRx = baseRx * (1 - pullAmount * .06);
    const rightRx = baseRx * (1 + pullAmount * 1.05);
    const centerX = DESIGN_W / 2;
    const centerY = 712;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(pullAngle);

    function controlBlobPath(scale = 1, offsetY = 0) {
      const left = leftRx * scale;
      const right = rightRx * scale;
      const height = ry * scale;
      ctx.beginPath();
      ctx.moveTo(wobble * .12, offsetY - height);
      ctx.bezierCurveTo(
        right * .62 + wobble, offsetY - height * .98,
        right * 1.02, offsetY - height * .38,
        right * .95, offsetY + height * .05
      );
      ctx.bezierCurveTo(
        right, offsetY + height * .55,
        right * .48, offsetY + height,
        wobble * .10, offsetY + height
      );
      ctx.bezierCurveTo(
        -left * .48, offsetY + height,
        -left, offsetY + height * .53,
        -left * .94, offsetY - height * .04
      );
      ctx.bezierCurveTo(
        -left, offsetY - height * .43,
        -left * .58 - wobble, offsetY - height * .98,
        wobble * .12, offsetY - height
      );
      ctx.closePath();
    }

    ctx.save();
    ctx.filter = 'blur(6.2px)';
    controlBlobPath(1.07, 1.5);
    const outerRadius = Math.max(rightRx, ry) * 1.02;
    const outer = ctx.createRadialGradient(rightRx * pullAmount * .14 - 6, -8, 4, rightRx * pullAmount * .14, 1, outerRadius);
    outer.addColorStop(0, `rgba(123,166,211,${(.105 + press * .025).toFixed(3)})`);
    outer.addColorStop(.46, 'rgba(111,164,211,.070)');
    outer.addColorStop(.76, 'rgba(132,179,216,.030)');
    outer.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = outer;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.filter = 'blur(1.15px)';
    controlBlobPath();
    const water = ctx.createLinearGradient(-leftRx, -ry, rightRx, ry);
    water.addColorStop(0, `rgba(154,185,218,${(.135 + press * .020).toFixed(3)})`);
    water.addColorStop(.28, `rgba(118,169,215,${(.105 + press * .018).toFixed(3)})`);
    water.addColorStop(.56, 'rgba(121,183,213,.082)');
    water.addColorStop(.78, 'rgba(147,170,216,.092)');
    water.addColorStop(1, 'rgba(255,255,255,.032)');
    ctx.fillStyle = water;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.filter = 'blur(3.5px)';
    const pigmentShift = rightRx * pullAmount * .18;
    const controlPigments = [
      [-13 + pigmentShift, -15, 23, 'rgba(111,151,210,.112)'],
      [ 12 + pigmentShift,  -3, 27, 'rgba(91,163,216,.096)'],
      [ -5 + pigmentShift,  18, 28, 'rgba(105,190,194,.070)'],
      [ 15 + pigmentShift,  20, 21, 'rgba(146,132,205,.066)'],
    ];
    controlPigments.forEach(([px, py, radius, color], index) => {
      const pigment = ctx.createRadialGradient(px, py, 1, px, py, radius + pullAmount * 8);
      pigment.addColorStop(0, color);
      pigment.addColorStop(.58, color.replace(/0\.(\d+)\)/, '0.036)'));
      pigment.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = pigment;
      ctx.beginPath();
      ctx.ellipse(px, py, radius * (.88 + (index % 2) * .10), radius, pullAngle * .08, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    ctx.restore();
  }

  function drawAim() {
    const now = performance.now();
    const phase = state.verticalPhase || 0;
    const wave = Math.sin(phase * Math.PI);
    const travel = Math.abs(wave);
    const directionSpeed = Math.abs(Math.cos(phase * Math.PI));
    const breathe = Math.sin(now * 0.0052);
    const wobble = Math.sin(now * 0.0074 + phase * 3.4);
    const wobble2 = Math.sin(now * 0.011 + phase * 5.8);

    // 움직이는 동안 세로로 늘어나고 가로로 눌리며,
    // 방향 전환 직후에는 옆면이 한 박자 늦게 따라오는 젤리 변형을 줍니다.
    const rx = 20.5 * (1 - directionSpeed * 0.115 + breathe * 0.020 + wobble2 * 0.012);
    const ry = 25.5 * (1 + directionSpeed * 0.165 - breathe * 0.010);
    const sideWobble = 2.8 * wobble + 1.1 * wobble2;

    ctx.save();
    ctx.translate(state.aimX, state.aimY);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 가장자리의 물 번짐. 형태 자체는 선명한 UI가 아니라 종이에 스민 담채처럼 보이게 합니다.
    drawWaterBlobSurface({
      rx,
      ry,
      wobble: sideWobble,
      palette: AIM_WATER_PALETTE,
      highlightAlpha: .64,
    });

    // 핵은 먹이 맺힌 둥근 시작과 가늘게 빠지는 끝을 가진 진회색 붓십자입니다.
    const coreAlpha = 0.74 + Math.sin(now * 0.0047) * 0.04;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 바깥 번짐
    ctx.strokeStyle = `rgba(56,59,64,${(coreAlpha * 0.20).toFixed(3)})`;
    ctx.lineWidth = 3.0;
    ctx.beginPath();
    ctx.moveTo(-3.55, 0.36);
    ctx.quadraticCurveTo(-1.1, -0.38, 2.35, 0.06);
    ctx.quadraticCurveTo(3.2, 0.12, 4.10, -0.02);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0.18, -3.55);
    ctx.quadraticCurveTo(-0.34, -1.1, 0.02, 2.30);
    ctx.quadraticCurveTo(0.06, 3.15, -0.05, 4.05);
    ctx.stroke();

    // 주 획: 시작은 둥글고 끝은 얇게 삐침
    const horizontal = ctx.createLinearGradient(-3.8, 0, 4.2, 0);
    horizontal.addColorStop(0, `rgba(44,47,52,${(coreAlpha * 0.82).toFixed(3)})`);
    horizontal.addColorStop(0.62, `rgba(44,47,52,${(coreAlpha * 0.66).toFixed(3)})`);
    horizontal.addColorStop(1, `rgba(44,47,52,${(coreAlpha * 0.24).toFixed(3)})`);
    ctx.strokeStyle = horizontal;
    ctx.lineWidth = 2.15;
    ctx.beginPath();
    ctx.moveTo(-3.25, 0.30);
    ctx.quadraticCurveTo(-0.65, -0.28, 2.55, 0.08);
    ctx.quadraticCurveTo(3.25, 0.12, 3.95, -0.05);
    ctx.stroke();

    const vertical = ctx.createLinearGradient(0, -3.8, 0, 4.2);
    vertical.addColorStop(0, `rgba(44,47,52,${(coreAlpha * 0.82).toFixed(3)})`);
    vertical.addColorStop(0.62, `rgba(44,47,52,${(coreAlpha * 0.66).toFixed(3)})`);
    vertical.addColorStop(1, `rgba(44,47,52,${(coreAlpha * 0.24).toFixed(3)})`);
    ctx.strokeStyle = vertical;
    ctx.lineWidth = 2.1;
    ctx.beginPath();
    ctx.moveTo(0.18, -3.25);
    ctx.quadraticCurveTo(-0.24, -0.55, 0.04, 2.55);
    ctx.quadraticCurveTo(0.10, 3.25, -0.06, 3.95);
    ctx.stroke();

    // 마른 붓결
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = 'rgba(34,37,41,0.68)';
    ctx.lineWidth = 0.95;
    ctx.beginPath();
    ctx.moveTo(-2.45, -0.08);
    ctx.quadraticCurveTo(0.05, 0.18, 2.10, -0.05);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-0.08, -2.45);
    ctx.quadraticCurveTo(0.12, 0.05, -0.05, 2.12);
    ctx.stroke();

    // 둥근 먹 맺힘 시작점
    ctx.globalAlpha = 0.82;
    ctx.fillStyle = 'rgba(43,46,50,0.56)';
    ctx.beginPath();
    ctx.ellipse(-3.15, 0.24, 0.88, 0.62, -0.10, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0.14, -3.10, 0.62, 0.88, 0.05, 0, Math.PI * 2);
    ctx.fill();

    // 얇게 삐치는 끝부분 강조
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = 'rgba(41,44,48,0.42)';
    ctx.lineWidth = 0.68;
    ctx.beginPath();
    ctx.moveTo(3.10, 0.00);
    ctx.quadraticCurveTo(3.52, -0.02, 4.28, -0.18);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0.00, 3.08);
    ctx.quadraticCurveTo(0.02, 3.50, -0.20, 4.22);
    ctx.stroke();
    ctx.restore();

    // 이동 방향으로 남는 미세한 물기: 빠르게 움직일 때만 조금 길어집니다.
    const trailLen = 6 + directionSpeed * 11;
    ctx.strokeStyle = 'rgba(131,147,194,0.114)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(wobble * 0.5, -ry - 2);
    ctx.quadraticCurveTo(-2.0 + wobble, -ry - trailLen * 0.55, 0.4, -ry - trailLen);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-wobble * 0.35, ry + 2);
    ctx.quadraticCurveTo(2.1 - wobble, ry + trailLen * 0.45, -0.2, ry + trailLen * 0.78);
    ctx.stroke();

    // 작은 물방울 입자. 시선이 분산되지 않도록 2개 이하로만 표현합니다.
    ctx.fillStyle = 'rgba(126,151,199,0.156)';
    ctx.beginPath();
    ctx.arc(1.6 + wobble * 0.6, -ry - trailLen - 2.0, 0.75, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(147,128,190,0.120)';
    ctx.beginPath();
    ctx.arc(-1.2, ry + trailLen + 1.2, 0.55, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    const elapsed = Math.min(1, (performance.now() - state.holdStart) / 900);
    const wash = ctx.createLinearGradient(94, 0, 296, 0);
    wash.addColorStop(0, 'rgba(128,136,154,0)');
    wash.addColorStop(0.12, 'rgba(128,136,154,0.14)');
    wash.addColorStop(Math.max(0.12, elapsed), 'rgba(128,136,154,0.22)');
    wash.addColorStop(Math.min(1, elapsed + 0.06), 'rgba(128,136,154,0)');
    ctx.fillStyle = 'rgba(128,136,154,0.040)';
    ctx.fillRect(94, 798, 202, 1.2);
    ctx.fillStyle = wash;
    ctx.fillRect(94, 797.7, 202, 1.8);
  }

  function drawFlyingLight() {
    const f = state.flight;
    if (!f) return;
    const p = clamp(f.t / f.duration, 0, 1);
    const eased = 1 - Math.pow(1 - p, 2.4);
    const x = lerp(f.startX, f.endX, eased);
    const y = lerp(f.startY, f.endY, eased);
    const size = lerp(8.8, 1.4, eased);

    // 가까운 곳은 크고 부드럽고, 멀어질수록 작은 빛점이 됩니다.
    for (let i = 5; i >= 1; i -= 1) {
      const trailP = clamp(eased - i * 0.027, 0, 1);
      const tx = lerp(f.startX, f.endX, trailP);
      const ty = lerp(f.startY, f.endY, trailP);
      const tr = lerp(7.4, 1.1, trailP) * (1 - i * 0.095);
      ctx.fillStyle = `rgba(169,181,205,${0.025 + (6 - i) * 0.018})`;
      ctx.beginPath();
      ctx.arc(tx, ty, Math.max(0.7, tr), 0, Math.PI * 2);
      ctx.fill();
    }

    const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 3.2);
    glow.addColorStop(0, 'rgba(255,255,255,0.98)');
    glow.addColorStop(0.22, 'rgba(202,214,235,0.86)');
    glow.addColorStop(0.56, 'rgba(209,193,222,0.34)');
    glow.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, size * 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.98)';
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.75, size * 0.43), 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSignalman() {
    const signal = state.signal;
    if (!signal) return;
    const target = getTargetGeometry();
    const fadeIn = clamp(signal.t / 0.22, 0, 1);
    const fadeOut = clamp((signal.duration - signal.t) / 0.28, 0, 1);
    const alpha = Math.min(fadeIn, fadeOut);
    const side = target.cx > DESIGN_W - 58 ? -1 : 1;
    const x = target.cx + side * 28;
    const y = target.cy + 26;
    const wave = Math.sin(signal.t * 10.5);
    const clothWave = Math.sin(signal.t * 10.6 + 0.7);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.scale(side * 0.92, 0.92);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 발아래의 희미한 먹점으로 산등성이에 서 있는 원경감을 만듭니다.
    ctx.strokeStyle = 'rgba(58,63,69,0.24)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-6.8, 20.8);
    ctx.quadraticCurveTo(-1.7, 19.3, 6.4, 20.7);
    ctx.stroke();

    // 하늘색 도포의 번진 담채층.
    ctx.save();
    ctx.filter = 'blur(1.05px)';
    const robeWash = ctx.createLinearGradient(-4, 1, 4, 20);
    robeWash.addColorStop(0, 'rgba(119,174,202,0.28)');
    robeWash.addColorStop(0.55, 'rgba(91,157,194,0.48)');
    robeWash.addColorStop(1, 'rgba(65,128,168,0.22)');
    ctx.fillStyle = robeWash;
    ctx.beginPath();
    ctx.moveTo(-2.6, 1.3);
    ctx.quadraticCurveTo(0, -0.4, 2.7, 1.4);
    ctx.quadraticCurveTo(4.8, 8.7, 3.9, 18.3);
    ctx.quadraticCurveTo(0.2, 20.5, -4.1, 18.2);
    ctx.quadraticCurveTo(-4.6, 9.2, -2.6, 1.3);
    ctx.fill();
    ctx.restore();

    // 도포의 외곽은 한두 번의 얇은 먹선만 남깁니다.
    ctx.strokeStyle = 'rgba(48,55,62,0.61)';
    ctx.lineWidth = 0.72;
    ctx.beginPath();
    ctx.moveTo(-2.5, 1.3);
    ctx.quadraticCurveTo(-4.3, 7.5, -3.8, 18.1);
    ctx.quadraticCurveTo(0.2, 20.2, 3.8, 18.1);
    ctx.quadraticCurveTo(4.5, 8.5, 2.5, 1.4);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(46,54,62,0.34)';
    ctx.lineWidth = 0.48;
    ctx.beginPath();
    ctx.moveTo(0.25, 3.1);
    ctx.quadraticCurveTo(-0.4, 10.8, 0.2, 18.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-2.9, 9.4);
    ctx.quadraticCurveTo(0.1, 10.2, 3.2, 9.1);
    ctx.stroke();

    // 고개와 갓: 얼굴을 묘사하지 않고 먹점과 긴 갓끈 같은 선으로만 표현합니다.
    ctx.fillStyle = 'rgba(54,57,60,0.68)';
    ctx.beginPath();
    ctx.arc(0, -1.15, 1.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(38,42,46,0.84)';
    ctx.lineWidth = 0.72;
    ctx.beginPath();
    ctx.ellipse(0, -3.15, 4.6, 0.72, -0.02, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-1.05, -3.4);
    ctx.lineTo(-0.7, -5.25);
    ctx.lineTo(0.7, -5.25);
    ctx.lineTo(1.05, -3.4);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(43,47,51,0.38)';
    ctx.lineWidth = 0.42;
    ctx.beginPath();
    ctx.moveTo(-2.25, -2.8); ctx.lineTo(-1.3, 1.6);
    ctx.moveTo(2.25, -2.8); ctx.lineTo(1.45, 1.5);
    ctx.stroke();

    // 한쪽 팔은 자연스럽게 늘어뜨리고, 다른 팔만 깃대를 받칩니다.
    ctx.strokeStyle = 'rgba(49,56,63,0.57)';
    ctx.lineWidth = 0.72;
    ctx.beginPath();
    ctx.moveTo(-2.5, 3.1);
    ctx.quadraticCurveTo(-5.1, 8.1, -4.2, 13.4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(2.3, 3.2);
    ctx.quadraticCurveTo(4.5, 5.4, 5.0, 8.3);
    ctx.stroke();

    // 판정이 잘 보이도록 깃발 전체를 크게 위아래로 흔듭니다.
    ctx.save();
    ctx.translate(4.8, 8.2 + wave * 4.8);
    ctx.rotate(-0.12 + wave * 0.30);
    ctx.scale(1.22, 1.22);
    ctx.strokeStyle = 'rgba(44,48,52,0.72)';
    ctx.lineWidth = 0.72;
    ctx.beginPath();
    ctx.moveTo(0, 10.4);
    ctx.quadraticCurveTo(-0.2, -2.3, 0.15, -15.2);
    ctx.stroke();

    const flagColors = {
      hit: ['rgba(174,58,55,0.95)', 'rgba(194,78,72,0.28)'],
      near: ['rgba(202,157,55,0.95)', 'rgba(225,188,83,0.28)'],
      miss: ['rgba(28,31,35,0.94)', 'rgba(47,51,56,0.24)'],
    };
    const [flagColor, flagWash] = flagColors[signal.type] || flagColors.miss;
    ctx.save();
    ctx.filter = 'blur(.55px)';
    ctx.fillStyle = flagWash;
    ctx.beginPath();
    ctx.moveTo(0.1, -15.1);
    ctx.bezierCurveTo(3.8, -16.2 + clothWave * 0.5, 7.4, -13.7 - clothWave * 0.35, 10.5, -14.7 + clothWave * 0.45);
    ctx.lineTo(9.8, -8.2 + clothWave * 0.25);
    ctx.bezierCurveTo(6.4, -9.2, 3.6, -7.8 - clothWave * 0.32, 0.1, -8.8);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = flagColor;
    ctx.beginPath();
    ctx.moveTo(0.1, -15.15);
    ctx.bezierCurveTo(3.7, -15.9 + clothWave * 0.42, 7.3, -13.7 - clothWave * 0.28, 10.2, -14.5 + clothWave * 0.38);
    ctx.lineTo(9.55, -8.65 + clothWave * 0.18);
    ctx.bezierCurveTo(6.15, -9.45, 3.45, -8.15 - clothWave * 0.26, 0.1, -8.95);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 멀리 보이는 인물 특유의 불완전한 먹점과 담채 얼룩.
    ctx.globalAlpha = alpha * 0.22;
    ctx.fillStyle = '#47515a';
    ctx.beginPath(); ctx.arc(-3.9, 14.2, 0.58, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6e9eb7';
    ctx.beginPath(); ctx.arc(2.9, 16.1, 0.85, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (signal.showBubble && (signal.type === 'hit' || signal.type === 'miss')) {
      const bubbleIn = clamp((signal.t - .12) / .16, 0, 1);
      const bubbleOut = clamp((signal.duration - signal.t - .10) / .20, 0, 1);
      drawSignalBubble(x, y - 8, signal.type === 'hit' ? '명중입니다!' : '빗나갔습니다!', alpha * Math.min(bubbleIn, bubbleOut));
    }
  }

  function drawSignalBubble(anchorX, anchorY, text, alpha) {
    const width = text === '명중입니다!' ? 62 : 76;
    const height = 22;
    const x = clamp(anchorX - width / 2, 7, DESIGN_W - width - 7);
    const y = Math.max(8, anchorY - 31);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(255,255,255,.91)';
    ctx.strokeStyle = 'rgba(70,73,80,.16)';
    ctx.lineWidth = .7;
    roundRect(ctx, x, y, width, height, 8);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(clamp(anchorX - 3, x + 10, x + width - 10), y + height - .5);
    ctx.lineTo(clamp(anchorX + 3, x + 10, x + width - 10), y + height - .5);
    ctx.lineTo(anchorX, y + height + 5);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(42,45,51,.86)';
    ctx.font = '600 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x + width / 2, y + height / 2 + .3);
    ctx.restore();
  }

  function drawStillnessVeil() {
    ctx.save();
    ctx.fillStyle = 'rgba(235,238,243,0.10)';
    ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);
    ctx.restore();

  function initAudio() {
    if (audio) {
      if (audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {});
      return;
    }
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const actx = new AudioContext();
    const master = actx.createGain();
    master.gain.value = 0.30;
    master.connect(actx.destination);
    audio = { ctx: actx, master, drawOsc: null, drawGain: null };
  }

  function initBgm() {
    if (bgm) return bgm;
    bgm = new Audio('BGM1.mp3');
    bgm.loop = true;
    bgm.preload = 'auto';
    bgm.volume = .32;
    bgm.muted = state.muted;
    return bgm;
  }

  function startGameBgm({ restart = false } = {}) {
    const player = initBgm();
    bgmSessionActive = true;
    player.muted = state.muted;
    if (restart) {
      try { player.currentTime = 0; } catch (_) {}
    }
    if (!state.muted) player.play().catch(() => {});
  }

  function resumeGameBgm() {
    if (!bgmSessionActive || state.muted) return;
    const player = initBgm();
    player.muted = false;
    if (player.paused) player.play().catch(() => {});
  }

  function stopGameBgm() {
    bgmSessionActive = false;
    if (!bgm) return;
    bgm.pause();
    try { bgm.currentTime = 0; } catch (_) {}
  }

  function scheduleAmbient() {
    if (!audio || ambientTimer) return;
    const chirp = () => {
      if (!state.muted && audio) {
        const now = audio.ctx.currentTime;
        const osc = audio.ctx.createOscillator();
        const gain = audio.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(random(1050, 1550), now);
        osc.frequency.exponentialRampToValueAtTime(random(1550, 2200), now + 0.12);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.05, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.17);
        osc.connect(gain).connect(audio.master);
        osc.start(now);
        osc.stop(now + 0.18);
      }
      ambientTimer = window.setTimeout(chirp, random(5200, 9800));
    };
    ambientTimer = window.setTimeout(chirp, 3200);
  }

  function playDrawTone() {
    if (!audio || state.muted) return;
    stopDrawTone();
    const now = audio.ctx.currentTime;
    const osc = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(92, now);
    osc.frequency.linearRampToValueAtTime(121, now + 1.2);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(0.035, now + 0.25);
    gain.gain.linearRampToValueAtTime(0.055, now + 1.2);
    osc.connect(gain).connect(audio.master);
    osc.start(now);
    audio.drawOsc = osc;
    audio.drawGain = gain;
  }

  function stopDrawTone() {
    if (!audio?.drawOsc || !audio?.drawGain) return;
    const now = audio.ctx.currentTime;
    audio.drawGain.gain.cancelScheduledValues(now);
    audio.drawGain.gain.setValueAtTime(audio.drawGain.gain.value || 0.02, now);
    audio.drawGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
    try { audio.drawOsc.stop(now + 0.05); } catch (_) {}
    audio.drawOsc = null;
    audio.drawGain = null;
  }

  function playRelease() {
    if (!audio || state.muted) return;
    const now = audio.ctx.currentTime;

    // 짧은 활시위 탄성음. 비행음과 충돌음은 내지 않습니다.
    const osc = audio.ctx.createOscillator();
    const gain = audio.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(185, now);
    osc.frequency.exponentialRampToValueAtTime(58, now + 0.13);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.18, now + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
    osc.connect(gain).connect(audio.master);
    osc.start(now);
    osc.stop(now + 0.17);

    const buffer = audio.ctx.createBuffer(1, Math.floor(audio.ctx.sampleRate * 0.035), audio.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2.4);
    const noise = audio.ctx.createBufferSource();
    const noiseGain = audio.ctx.createGain();
    noise.buffer = buffer;
    noiseGain.gain.setValueAtTime(0.10, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.038);
    noise.connect(noiseGain).connect(audio.master);
    noise.start(now);
  }

  function playImpact() {}

  let homeTransitionInProgress = false;

  async function returnHomeFromGame() {
    if (state.status === 'selecting' || homeTransitionInProgress) return;
    homeTransitionInProgress = true;
    try {
      stopGameBgm();
      cancelGameEntrance();
      if (state.status === 'aiming') cancelAim({ restoreFirstPrompt: false });
      hideAllPanels();
      failPanel.classList.add('hidden');
      state.streak = 0;
      updateHud();
      state.status = 'selecting';
      backgroundSelector.classList.remove('hidden');
      introSequencePlayed = true;
      state.selectedEmotion = '마음';
      state.selectedDoorEmotion = '마음';
      showCategoryView();
    } finally {
      homeTransitionInProgress = false;
    }
  }

  function retryAfterMiss() {
    failPanel.classList.add('hidden');
    newRound();
  }

  function returnToPlaceSelection() {
    failPanel.classList.add('hidden');
    state.streak = 0;
    updateHud();
    // 실패 후 "처음으로"는 인트로를 반복하지 않고 곧바로 장소 선택 화면으로 간다.
    introSequencePlayed = true;
    showBackgroundSelector({ replayIntro: false });
  }

  function handlePanelAction(event) {
    const actionTarget = event.target?.closest?.('[data-action]');
    const action = actionTarget?.dataset?.action;
    if (!action) return;
    playMenuTap();
    if (action === 'resume') resume();
    if (action === 'restart') newRound();
    if (action === 'pause-home') returnHomeFromGame();
    if (action === 'next-stage') advanceToNextStage();
    if (action === 'journal-close') closeJournal();
    if (action === 'life-journal-close') closeLifeJournal();
    if (action === 'emotion-again') showEmotionSelection();
    if (action === 'sound') toggleSound();
    if (action === 'fail-retry') retryAfterMiss();
    if (action === 'fail-home') returnToPlaceSelection();
  }

  function frame(now) {
    const dt = Math.min(0.035, Math.max(0, (now - state.lastTime) / 1000));
    state.lastTime = now;
    if (!['selecting', 'paused', 'journal', 'result', 'life-journal', 'collection', 'failed'].includes(state.status)) update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function roundRect(context, x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    context.beginPath();
    context.moveTo(x + radius, y);
    context.arcTo(x + w, y, x + w, y + h, radius);
    context.arcTo(x + w, y + h, x, y + h, radius);
    context.arcTo(x, y + h, x, y, radius);
    context.arcTo(x, y, x + w, y, radius);
    context.closePath();
  }

  function hexToRgba(hex, alpha) {
    const normalized = String(hex || '#ffffff').replace('#', '');
    const value = normalized.length === 3
      ? normalized.split('').map((char) => char + char).join('')
      : normalized.padEnd(6, 'f').slice(0, 6);
    const number = Number.parseInt(value, 16);
    const r = (number >> 16) & 255;
    const g = (number >> 8) & 255;
    const b = number & 255;
    return `rgba(${r},${g},${b},${alpha})`;
  }

  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const random = (min, max) => min + Math.random() * (max - min);

  canvas.addEventListener('pointerdown', startAim, { passive: false });
  canvas.addEventListener('pointermove', moveAim, { passive: false });
  canvas.addEventListener('pointerup', releaseAim, { passive: false });
  canvas.addEventListener('pointercancel', (event) => {
    if (event.pointerId === state.pointerId) cancelAim({ pointerId: event.pointerId });
  }, { passive: false });
  canvas.addEventListener('lostpointercapture', (event) => {
    if (state.status === 'aiming' && event.pointerId === state.pointerId) {
      cancelAim({ pointerId: event.pointerId });
    }
  });
  homeButton.addEventListener('click', returnHomeFromGame);
  menuButton.addEventListener('click', openPause);
  collectionButton.addEventListener('click', openCollection);
  collectionBackButton.addEventListener('click', () => {
    closeCollection();
  });
  let collectionSwipe = null;
  collectionPanel.addEventListener('pointerdown', (event) => {
    if (event.target?.closest?.('button')) return;
    const card = event.target?.closest?.('[data-collection-card-id]');
    if (!card) return;
    collectionSwipe = { id: card.dataset.collectionCardId, x: event.clientX, y: event.clientY };
  });
  collectionPanel.addEventListener('pointerup', (event) => {
    if (!collectionSwipe) return;
    const swipe = collectionSwipe;
    collectionSwipe = null;
    const dx = event.clientX - swipe.x;
    const dy = event.clientY - swipe.y;
    if (Math.abs(dx) >= 38 && Math.abs(dx) > Math.abs(dy)) {
      changeCollectionCardBackground(swipe.id, dx < 0 ? 1 : -1);
    }
  });
  collectionPanel.addEventListener('click', (event) => {
    const navButton = event.target?.closest?.('[data-card-nav]');
    if (navButton) {
      const card = navButton.closest('[data-collection-card-id]');
      changeCollectionCardBackground(card?.dataset.collectionCardId, Number(navButton.dataset.cardNav) || 1);
      return;
    }
  });
  pausePanel.addEventListener('click', handlePanelAction);
  journalPanel.addEventListener('click', (event) => {
    if (state.journalStartup) {
      closeJournal();
      return;
    }
    handlePanelAction(event);
  });
  resultPanel.addEventListener('click', (event) => {
    const messageButton = event.target?.closest?.('[data-result-message]');
    if (messageButton) {
      selectResultMessage(messageButton.dataset.resultMessage);
      playMenuTap();
      return;
    }
    handlePanelAction(event);
  });
  failPanel.addEventListener('click', handlePanelAction);
  lifeJournalPanel?.addEventListener('click', (event) => {
    const emotionTarget = event.target?.closest?.('[data-emotion]');
    const emotion = emotionTarget?.dataset?.emotion;
    if (emotion) {
      showEmotionMessage(emotion);
      return;
    }
    handlePanelAction(event);
  });
  locationList.addEventListener('pointerdown', async (event) => {
    const button = event.target?.closest?.('[data-category-id]');
    if (!button || doorSelectionLocked) return;
    event.preventDefault();
    doorSelectionLocked = true;
    const categoryId = button.dataset.categoryId;
    const locationId = button.dataset.locationId;
    state.selectedDoorName = LOCATION_LABELS[locationId] || button.textContent || '마음속 장소';
    state.selectedDoorEmotion = '마음';
    const scenes = categoryScenes(categoryId);
    if (!scenes.length) { doorSelectionLocked = false; return; }
    activeGalleryCategory = categoryId;
    const scene = scenes[Math.floor(Math.random() * scenes.length)];
    await playLocationEntryTransition(button);
    selectBackgroundScene(scene);
  });
  window.addEventListener('resize', () => {
    resizeCanvas();
  });
  window.addEventListener('blur', () => {
    if (state.status === 'selecting') stopDoorMotion();
    if (!['selecting', 'paused', 'journal', 'result', 'life-journal'].includes(state.status)) openPause();
  });
  window.addEventListener('focus', () => {
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !['selecting', 'paused', 'journal', 'result', 'life-journal'].includes(state.status)) openPause();
    if (document.hidden && state.status === 'selecting') stopDoorMotion();
  });

  resizeCanvas();
  updateHud();
  renderLocationList();
  const firstCategory = BACKGROUND_CATEGORIES[0];
  const firstImageCategory = firstCategory?.imageCategory || firstCategory?.id || '';
  const firstScene = Array.isArray(BACKGROUND_IMAGES[firstImageCategory]) ? BACKGROUND_IMAGES[firstImageCategory][0] : null;
  state.selectedBackground = firstScene || null;
  state.selectedCategoryId = firstImageCategory;
  const query = new URLSearchParams(window.location.search);
  if (query.has('skipSelect') && firstScene) {
    activeGalleryCategory = firstImageCategory;
    state.selectedDoorName = BACKGROUND_CATEGORIES[0]?.name || '마음의 문';
    state.selectedEmotion = '마음';
    state.selectedDoorEmotion = '마음';
    selectBackgroundScene(firstScene);
  } else {
    state.status = 'selecting';
    backgroundSelector.classList.remove('hidden');
    state.selectedEmotion = '마음';
    state.selectedDoorEmotion = '마음';
    playEntranceSequence();
  }
  if (query.has('debug')) {
    window.__archeryDebug = {
      state, newRound, getTargetGeometry, getStageTargetX, updateAimGuideDirection,
      showBackgroundSelector, BACKGROUND_CATEGORIES, BACKGROUND_IMAGES, DOOR_EMOTIONS
    };
  }
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
