<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <title>봉인실 기록관 · Peelthread Archive</title>
  <style>
    :root{color-scheme:dark;--ink:#071426;--panel:#0d2134;--gold:#f5cb68;--teal:#5de1d0;--danger:#ff6f77;--paper:#eaf5ef;--muted:#9cb4bc}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030b15;color:var(--paper);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
    body{display:grid;place-items:center;overscroll-behavior:none}
    button{font:inherit;color:inherit;min-height:44px;border:1px solid #365367;border-radius:14px;background:#122c41;padding:9px 14px;cursor:pointer;touch-action:manipulation}
    button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
    button.primary{border-color:#dec066;background:linear-gradient(135deg,#9b7424,#d2a941);color:#081421;font-weight:900;box-shadow:0 7px 20px #0008}
    button.ghost{background:#0a1b2b}
    button:disabled{opacity:.42;cursor:not-allowed}
    #shell{position:relative;width:min(100vw,430px);height:100dvh;max-height:900px;overflow:hidden;background:radial-gradient(circle at 50% 10%,#17384c 0,#081a2d 38%,#04101e 100%);box-shadow:0 0 60px #000}
    #shell:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(90deg,transparent 95%,#d5bd7255 96%),linear-gradient(0deg,transparent 95%,#5de1d033 96%);background-size:38px 38px}
    #app{position:absolute;inset:0;overflow:hidden}
    .screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));z-index:1}
    .screen.active{display:flex}
    .brand{letter-spacing:.22em;color:var(--gold);font-size:11px;font-weight:900;text-transform:uppercase}
    h1,h2,p{margin:0}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,8vw,40px);line-height:1.08;color:#fff1bd;text-shadow:0 2px 20px #d6a94455}
    h2{font-size:21px;color:#fff0bd}
    .sub{color:var(--muted);line-height:1.5;font-size:14px}
    .start-art{position:relative;flex:1;min-height:170px;display:grid;place-items:center}
    .archive-door{position:relative;width:min(60vw,230px);aspect-ratio:.72;border:3px double #b8954e;border-radius:100px 100px 18px 18px;background:radial-gradient(circle at 50% 36%,#24536a,#0a2034 47%,#06111f 48%);box-shadow:inset 0 0 50px #000,0 0 40px #4ad8cc22}
    .archive-door:before,.archive-door:after{content:"";position:absolute;inset:12%;border:1px solid #e6c66d77;border-radius:50%;transform:rotate(32deg)}
    .archive-door:after{transform:rotate(-32deg);border-color:#5de1d088}
    .seal{position:absolute;left:50%;top:50%;width:62px;height:62px;translate:-50% -50%;display:grid;place-items:center;border:2px solid var(--gold);border-radius:50%;background:#0d2938;color:var(--teal);font-size:30px;box-shadow:0 0 25px #5de1d055}
    .start-copy{display:grid;gap:8px;text-align:center;margin-top:8px}
    .start-actions{display:grid;grid-template-columns:1fr 52px;gap:8px;margin-top:16px}
    .topbar{display:flex;align-items:center;gap:10px;min-height:52px}
    .topbar .back{width:46px;padding:0;font-size:20px}
    .topbar .titlebox{flex:1;min-width:0}
    .topbar .titlebox .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
    .stars-total{min-width:58px;text-align:center;color:var(--gold);font-weight:900}
    #contractGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0;padding-top:9px}
    .contract{position:relative;min-height:0;padding:10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;background:linear-gradient(145deg,#102c41,#091827);border-color:#28495e}
    .contract:after{content:"";position:absolute;width:64px;height:64px;right:-20px;bottom:-22px;border:1px solid #5de1d044;border-radius:50%;box-shadow:0 0 0 10px #d6b95b12,0 0 0 20px #5de1d00d}
    .contract strong{display:block;font-size:14px;color:#ffedb0;position:relative;z-index:1}
    .contract small{display:block;color:#95aeb8;line-height:1.25;margin-top:3px;position:relative;z-index:1}
    .contract .meta{font-size:11px;color:var(--teal);position:relative;z-index:1}
    .contract.locked{filter:saturate(.35)}
    .contract.midnight{border-color:#8d69c7;background:linear-gradient(145deg,#251b43,#0a182b)}
    .gamehead{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
    .gamehead .contract-name{color:#fff0bb;font-weight:900;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hud-row{display:flex;gap:7px;margin-top:5px;color:#a9c1c8;font-size:11px}
    .hud-row b{color:#fff;font-size:12px}
    .icon-buttons{display:flex;gap:6px}
    .icon-buttons button{width:44px;height:44px;padding:0}
    .meter-wrap{margin-top:8px;display:grid;grid-template-columns:58px 1fr 34px;align-items:center;gap:6px;font-size:11px;color:#9eb4bb}
    .meter{height:10px;border-radius:10px;background:#020a12;border:1px solid #304658;overflow:hidden}
    #tensionBar{height:100%;width:0;background:linear-gradient(90deg,#62dfca,#f6c858 55%,#ff6671);transition:width .1s linear}
    #canvasWrap{position:relative;flex:1;min-height:0;margin:8px 0;border:1px solid #28445a;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#15364a,#071626 68%);box-shadow:inset 0 0 35px #0008;touch-action:none}
    #gameCanvas{display:block;width:100%;height:100%;touch-action:none}
    #pauseBadge{position:absolute;inset:0;display:none;place-items:center;background:#03101bcc;color:#ffedb0;font-weight:900;letter-spacing:.08em;z-index:3}
    #pauseBadge.show{display:grid}
    #toast{position:absolute;left:50%;top:12px;translate:-50% 0;max-width:88%;padding:7px 12px;border-radius:99px;background:#03111ee8;border:1px solid #5de1d088;color:#dffefa;font-size:12px;font-weight:800;opacity:0;transform:translateY(-8px);transition:.18s;pointer-events:none;z-index:4;white-space:nowrap}
    #toast.show{opacity:1;transform:translateY(0)}
    .gamefoot{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-height:48px}
    #instruction{color:#b8cdd1;font-size:12px;line-height:1.3}
    #cracks{color:#ff8c91;font-weight:900;letter-spacing:.12em}
    .result-card{margin:auto 0;display:grid;gap:13px;padding:20px;border:1px solid #446174;border-radius:24px;background:linear-gradient(155deg,#132d42dd,#071522ee);box-shadow:0 20px 50px #0009;text-align:center}
    .result-sigil{width:84px;height:84px;margin:auto;display:grid;place-items:center;border:2px solid var(--gold);border-radius:50%;font-size:38px;background:#092335;box-shadow:0 0 30px #d8b54a44}
    .result-sigil.fail{border-color:var(--danger);box-shadow:0 0 30px #ff637044}
    .result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .result-stats div{padding:9px 4px;border-radius:12px;background:#061521;color:#9fb7bd;font-size:11px}
    .result-stats b{display:block;color:#fff0b5;font-size:17px;margin-top:3px}
    .result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .result-actions .wide{grid-column:1/-1}
    .modal-layer{position:absolute;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:#020812d9}
    .modal-layer.open{display:grid}
    .modal{width:100%;max-width:360px;max-height:90%;overflow:auto;border:1px solid #587184;border-radius:22px;background:#0b2032;padding:20px;box-shadow:0 25px 70px #000}
    .modal h2{margin-bottom:8px}
    .modal p,.modal li{color:#bdd0d3;font-size:14px;line-height:1.5}
    .modal ul{padding-left:20px}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
    #countNumber{font-family:Georgia,serif;font-size:66px;color:var(--gold);text-align:center;text-shadow:0 0 28px #f2c76077}
    .rune-key{display:flex;gap:12px;align-items:center;margin:10px 0;padding:10px;border-radius:12px;background:#071727}
    .rune-key i{width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--teal);border-radius:50%;color:var(--gold);font-style:normal}
    @media (max-height:620px){.screen{padding-top:8px;padding-bottom:8px}.start-art{min-height:120px}.archive-door{width:125px}.start-copy .sub{font-size:12px}.topbar{min-height:44px}.contract{padding:7px}.contract small{font-size:10px}.contract strong{font-size:12px}.gamehead{height:43px}.hud-row{margin-top:1px}.meter-wrap{margin-top:3px}#canvasWrap{margin:4px 0}.gamefoot{min-height:44px}.result-card{padding:13px;gap:8px}.result-sigil{width:58px;height:58px;font-size:28px}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.contract:after{display:none}}
  </style>
</head>
<body>
<main id="shell">
  <div id="app">
    <section id="startScreen" class="screen active" aria-labelledby="mainTitle">
      <div class="brand">Atelier Mirage / Vault 07</div>
      <div class="start-art" aria-hidden="true"><div class="archive-door"><div class="seal">絲</div></div></div>
      <div class="start-copy">
        <h1 id="mainTitle">봉인실 기록관</h1>
        <p class="sub">금빛 실을 끊지 않고 벗겨, 잠든 유물의 기록을 복원하십시오.</p>
      </div>
      <div class="start-actions"><button id="enterBtn" class="primary">봉인실 입장</button><button id="startHelp" aria-label="도움말">?</button></div>
    </section>

    <section id="listScreen" class="screen" aria-labelledby="listTitle">
      <header class="topbar">
        <button id="listBack" class="back" aria-label="시작 화면으로">‹</button>
        <div class="titlebox"><h2 id="listTitle">복원 계약</h2><p class="sub">완료한 기록은 별과 함께 보존됩니다.</p></div>
        <div id="totalStars" class="stars-total" aria-label="보유 별">★ 0</div>
      </header>
      <div id="contractGrid"></div>
    </section>

    <section id="gameScreen" class="screen" aria-label="봉인 복원 게임">
      <div class="gamehead">
        <div><div id="gameContract" class="contract-name">계약</div><div class="hud-row"><span>유물 <b id="artifactHud">1/2</b></span><span>점수 <b id="scoreHud">0</b></span><span>시간 <b id="timeHud">0:00</b></span></div></div>
        <div class="icon-buttons"><button id="gameHelp" aria-label="도움말">?</button><button id="quitBtn" aria-label="계약 나가기">×</button></div>
      </div>
      <div class="meter-wrap"><span>봉인 장력</span><div class="meter"><div id="tensionBar"></div></div><b id="tensionText">0</b></div>
      <div id="canvasWrap">
        <canvas id="gameCanvas" width="720" height="720" aria-label="봉인 리본을 따라 드래그하는 플레이 영역"></canvas>
        <div id="toast" role="status"></div><div id="pauseBadge">기록 정지</div>
      </div>
      <div class="gamefoot"><div id="instruction">청록 탭을 잡고 금빛 결을 따라가십시오.</div><div id="cracks" aria-label="균열 수">◇ ◇ ◇</div></div>
    </section>

    <section id="resultScreen" class="screen" aria-labelledby="resultTitle">
      <div class="brand">Restoration Record</div>
      <div class="result-card">
        <div id="resultSigil" class="result-sigil">✦</div>
        <div><h1 id="resultTitle" tabindex="-1">기록 복원</h1><p id="resultCopy" class="sub"></p></div>
        <div class="result-stats"><div>점수<b id="resultScore">0</b></div><div>별<b id="resultStars">—</b></div><div>시간<b id="resultTime">0:00</b></div></div>
        <div id="resultActions" class="result-actions"></div>
      </div>
    </section>
  </div>

  <div id="modalLayer" class="modal-layer" role="presentation">
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>
</main>
<script>
(()=>{'use strict';
  const $=s=>document.querySelector(s);
  const screens={start:$('#startScreen'),list:$('#listScreen'),game:$('#gameScreen'),result:$('#resultScreen')};
  const canvas=$('#gameCanvas'),ctx=canvas.getContext('2d'),wrap=$('#canvasWrap');
  const TAU=Math.PI*2,STORE='peelthread.archive.v1';
  const PATHS={
    sweep:[[48,72],[92,58],[146,66],[202,96],[252,138],[288,190],[298,250],[278,302],[232,326],[172,318],[120,290]],
    hook:[[54,286],[80,224],[116,174],[162,144],[212,150],[246,184],[238,220],[202,238],[168,218],[180,178],[224,130],[284,92]],
    coil:[[56,98],[112,66],[188,64],[256,94],[294,148],[300,214],[270,276],[214,314],[146,310],[88,274],[54,216],[66,160],[108,126],[166,120],[214,144],[236,184],[226,224],[190,248],[148,242]],
    zig:[[42,294],[88,254],[56,214],[116,180],[84,134],[154,102],[220,126],[274,84],[310,132],[272,188],[314,236],[260,288],[198,268],[150,314]],
    fork:[[48,286],[84,242],[122,212],[168,202],[206,218],[242,196],[266,158],[248,118],[210,96],[170,106],[146,140],[158,170],[202,178],[250,166],[300,126]],
    wave:[[42,242],[78,190],[116,222],[152,270],[188,236],[220,176],[256,132],[300,154],[318,214],[292,274]],
    crown:[[42,276],[84,244],[112,184],[148,226],[184,118],[218,226],[252,176],[286,230],[318,194]],
    spiral:[[54,84],[116,54],[198,62],[266,104],[302,172],[292,244],[246,302],[176,322],[108,296],[64,244],[54,184],[84,136],[132,112],[186,114],[224,142],[238,184],[222,218],[190,236],[154,230]]
  };
  const contracts=[
    {name:'I. 첫 번째 장막',note:'기본 결 · 2개 유물',paths:['sweep','wave'],width:31,zones:[],limit:0},
    {name:'II. 갈고리 문서',note:'급커브 · 좁은 결',paths:['hook','zig','crown'],width:26,zones:[],limit:0},
    {name:'III. 박동하는 서고',note:'느림/빠름 속도대',paths:['coil','wave','hook'],width:29,zones:[{a:.16,b:.36,type:'slow'},{a:.48,b:.72,type:'fast'}],limit:0},
    {name:'IV. 거울 갈림길',note:'역주행 결 · 지정 분기',paths:['fork','zig','spiral'],width:27,zones:[{a:.34,b:.52,type:'reverse'}],branch:true,limit:0},
    {name:'V. 먹빛 개기식',note:'혼합 규칙 · 암전',paths:['spiral','crown','fork','coil'],width:27,zones:[{a:.12,b:.3,type:'slow'},{a:.42,b:.62,type:'fast'},{a:.7,b:.84,type:'reverse'}],branch:true,blackout:true,limit:0},
    {name:'자정 복원실',note:'60초 고정 시드 점수전',paths:['hook','spiral','zig','wave','fork','coil'],width:27,zones:[{a:.18,b:.32,type:'fast'},{a:.54,b:.7,type:'slow'}],branch:true,blackout:true,limit:60,midnight:true}
  ];
  let save=loadSave();
  let mode='start',contractIndex=0,runSerial=0,rewardToken=0,resultTimer=0,raf=0,lastFrame=performance.now();
  let state=freshState(),pointer={down:false,id:null,x:0,y:0,lastT:0,lastProgress:0,badMs:0},particles=[];
  let modalKind='',lastFocus=null,systemPaused=false,manualPaused=false,toastUntil=0,audioCtx=null,lastTickMark=-1;
  let rewardRemaining=0,rewardLast=0,rewardResumeSerial=0;

  function loadSave(){try{const x=JSON.parse(localStorage.getItem(STORE)||'{}');return {stars:Array.isArray(x.stars)?x.stars.slice(0,5):[0,0,0,0,0],best:Array.isArray(x.best)?x.best.slice(0,6):[0,0,0,0,0,0],unlocked:Math.max(1,Number(x.unlocked)||1)}}catch(e){return {stars:[0,0,0,0,0],best:[0,0,0,0,0,0],unlocked:1}}}
  function persist(){try{localStorage.setItem(STORE,JSON.stringify(save))}catch(e){}}
  function freshState(){return {phase:'idle',artifact:0,progress:0,tension:0,cracks:0,score:0,elapsed:0,activeSince:0,artifactStart:0,safe:null,highlight:0,rewardReserved:false,rewardConsumed:false,completedArtifacts:0,failReason:'',result:'',lastSafeAt:0,reverseTravel:0,reverseCleared:false,reverseActive:false,reverseCursor:0};}
  function totalStars(){return save.stars.reduce((a,b)=>a+(Number(b)||0),0)}
  function isUnlocked(i){return i===0||i<save.unlocked||(i===5&&totalStars()>=8)}
  function showScreen(name){mode=name;Object.entries(screens).forEach(([k,v])=>v.classList.toggle('active',k===name));}
  function showStart(){closeModal();showScreen('start')}
  function showList(){
    clearTimeout(resultTimer);
    if(mode==='game'||mode==='result'){runSerial++;rewardToken++;pointer.down=false;state.phase='idle'}
    closeModal();renderContracts();showScreen('list');
  }
  function renderContracts(){
    $('#totalStars').textContent='★ '+totalStars(); const grid=$('#contractGrid'); grid.textContent='';
    contracts.forEach((c,i)=>{const unlocked=isUnlocked(i),b=document.createElement('button');b.className='contract '+(!unlocked?'locked ':'')+(c.midnight?'midnight':'');b.disabled=!unlocked;b.innerHTML=`<span><strong>${unlocked?c.name:'🔒 봉인된 계약'}</strong><small>${unlocked?c.note:(i===5?'별 8개 필요':'이전 계약 완료 필요')}</small></span><span class="meta">${i<5?'★ '+(save.stars[i]||0)+' / 최고 '+(save.best[i]||0):'최고 '+(save.best[i]||0)}</span>`;b.addEventListener('click',()=>startContract(i));grid.appendChild(b)});
  }
  function startContract(i){
    if(!isUnlocked(i))return; clearTimeout(resultTimer); runSerial++; rewardToken++; contractIndex=i; state=freshState(); state.phase='playing'; state.safe=snapshot(); pointer.down=false; particles=[]; lastTickMark=-1; manualPaused=false; $('#gameContract').textContent=contracts[i].name; showScreen('game'); resizeCanvas(); updateHud(); toast('청록 탭에서 시작하십시오');
  }
  function currentContract(){return contracts[contractIndex]}
  function currentPath(){return PATHS[currentContract().paths[state.artifact%currentContract().paths.length]]}
  function snapshot(){return {artifact:state.artifact,progress:state.progress,elapsed:state.elapsed,score:state.score,cracks:state.cracks,completedArtifacts:state.completedArtifacts,artifactStart:state.artifactStart,reverseTravel:state.reverseTravel,reverseCleared:state.reverseCleared,reverseActive:state.reverseActive,reverseCursor:state.reverseCursor}}
  function restore(s){state.artifact=s.artifact;state.progress=s.progress;state.elapsed=s.elapsed;state.score=s.score;state.cracks=s.cracks;state.completedArtifacts=s.completedArtifacts;state.artifactStart=s.artifactStart;state.reverseTravel=s.reverseTravel||0;state.reverseCleared=!!s.reverseCleared;state.reverseActive=!!s.reverseActive;state.reverseCursor=s.reverseCursor||state.progress;state.tension=0;state.highlight=5;state.phase='playing';state.failReason='';pointer.down=false;pointer.badMs=0;lastTickMark=Math.floor(state.progress*20);updateHud()}
  function expectedArtifacts(){return currentContract().paths.length}
  function formatTime(sec){sec=Math.max(0,Math.ceil(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
  function updateHud(){
    const c=currentContract(); $('#artifactHud').textContent=c.midnight?(state.completedArtifacts+'개'):(Math.min(state.artifact+1,expectedArtifacts())+'/'+expectedArtifacts());
    $('#scoreHud').textContent=Math.floor(state.score); $('#timeHud').textContent=c.limit?formatTime(Math.max(0,c.limit-state.elapsed)):formatTime(state.elapsed);
    $('#tensionBar').style.width=Math.min(100,state.tension)+'%'; $('#tensionText').textContent=Math.round(state.tension);
    $('#cracks').textContent=[0,1,2].map(i=>i<state.cracks?'◆':'◇').join(' ');
    const z=zoneAt(state.progress); let text='청록 탭을 잡고 금빛 결을 따라가십시오.';
    if(state.reverseActive)text=state.reverseCleared?'↶ 되감기 완료 · 표시점으로 돌아오십시오.':`↶ 뒤로 ${Math.max(0,Math.ceil((.05-state.reverseTravel)*100))}% 더 되감으십시오.`;
    if(!state.reverseActive&&z==='slow')text='◉ 느림 문양 · 천천히 벗기십시오.'; if(!state.reverseActive&&z==='fast')text='✦ 빠름 문양 · 속도를 올리십시오.'; if(!state.reverseActive&&z==='reverse')text='↶ 역주행 문양 · 되감긴 결을 따라가십시오.';
    $('#instruction').textContent=text;
  }
  function resizeCanvas(){const r=wrap.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.max(2,Math.round(r.width*d));canvas.height=Math.max(2,Math.round(r.height*d));}
  function scaleInfo(){const w=canvas.width,h=canvas.height,s=Math.min(w/360,h/360);return {s,ox:(w-360*s)/2,oy:(h-360*s)/2}}
  function toCanvas(e){const r=canvas.getBoundingClientRect(),d=canvas.width/r.width;return {x:(e.clientX-r.left)*d,y:(e.clientY-r.top)*d}}
  function project(point,path){
    const {s,ox,oy}=scaleInfo();let best={dist:1e9,p:0,x:0,y:0,seg:0},lens=[],total=0;
    for(let i=0;i<path.length-1;i++){const a=path[i],b=path[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);lens.push(l);total+=l}
    let walked=0;
