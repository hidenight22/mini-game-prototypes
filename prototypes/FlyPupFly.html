    #hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;z-index:4;color:#16466b;font-weight:900;font-size:20px;text-shadow:0 2px #fff8}
    #dog{position:absolute;left:50%;bottom:174px;transform:translateX(-50%);width:132px;height:132px;object-fit:contain;filter:drop-shadow(0 8px 3px #17496640);z-index:3;transition:bottom .23s cubic-bezier(.2,.9,.2,1)}
    #dog.bounce{animation:pop .28s ease-out} #dog.fall{transition:bottom 1.05s cubic-bezier(.6,0,1,.5);bottom:-120px!important;animation:spin .7s linear infinite}

    @keyframes spin{to{rotate:25deg}}

    #message.show{animation:msg .55s ease-out}@keyframes msg{30%{opacity:1;transform:scale(1.15)}70%{opacity:1}100%{opacity:0;transform:scale(1)}}

    #runner{position:absolute;top:5px;left:0;width:52px;height:26px;border-radius:7px;background:#42e36c;box-shadow:0 3px 0 #149d39,0 0 10px #69ff91}

    .overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:linear-gradient(#4cbcf1e8,#e9fafff5);text-align:center}
    .hidden{display:none!important}
    h1{margin:0 0 5px;color:#fff;font-size:43px;line-height:1.1;text-shadow:0 5px 0 #2789bd,0 7px 12px #17688888}
    .bigdog{width:160px;height:145px;object-fit:contain;filter:drop-shadow(0 8px 4px #26668355)}
    .card{width:100%;max-width:360px;background:#fff;border-radius:26px;padding:22px;box-shadow:0 10px 0 #a3d6e9;margin:15px 0;color:#23435b}

    .coinIcon{display:inline-flex;width:25px;height:25px;margin-right:4px;border-radius:50%;align-items:center;justify-content:center;vertical-align:-3px;background:linear-gradient(145deg,#ffe879,#f3a713);border:3px solid #d9880b;box-shadow:inset 0 2px 0 #fff3a8,0 2px 0 #a75d08;color:#fff8c9;font-size:13px;line-height:1;text-shadow:0 1px 0 #b36a08}
    #hud .coinIcon{width:22px;height:22px;border-width:2px;font-size:11px;vertical-align:-2px}.dogChoice .coinIcon{width:15px;height:15px;margin-right:2px;border-width:2px;font-size:7px;vertical-align:-3px;box-shadow:inset 0 1px 0 #fff3a8,0 1px 0 #a75d08}
    .main{width:min(300px,90%);padding:15px 20px;border-radius:18px;background:#ffbd31;color:#57350c;font-weight:1000;font-size:22px;box-shadow:0 7px 0 #d77b18;margin:8px}.main:active{transform:translateY(5px);box-shadow:0 2px 0 #d77b18}
    .sub{padding:11px 18px;border-radius:14px;background:white;color:#2b6481;font-weight:900;box-shadow:0 4px 0 #9acddd;margin:6px}
    #shopList{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.dogChoice{width:76px;padding:7px 3px;border-radius:14px;background:#e7f7ff;border:3px solid transparent}.dogChoice img{display:block;width:64px;height:64px;object-fit:contain;margin:auto}.dogChoice small{display:block;font-size:11px;font-weight:800;color:#31556d}.dogChoice.selected{border-color:#ffb51d;background:#fff4c8}.dogChoice.locked{filter:grayscale(.7)}

  function refresh(){document.querySelectorAll('#coins').forEach(e=>e.textContent=money);$('coins').textContent=money;$('bestStart').textContent=best;$('shopCoins').textContent=money;dog.src=dogs[chosen].src;$('startDog').src=dogs[chosen].src}
  function loop(t){if(!playing)return;if(!last)last=t;const max=bar.clientWidth-runner.offsetWidth;x+=dir*speed*(t-last)/1000;if(x>=max){x=max;dir=-1}else if(x<=0){x=0;dir=1}runner.style.transform=`translateX(${x}px)`;last=t;raf=requestAnimationFrame(loop)}
  function start(){['start','result','shop'].forEach(id=>$(id).classList.add('hidden'));playing=true;x=0;dir=1;speed=230;last=0;height=0;earned=0;$('height').textContent=0;dog.className='';dog.style.bottom='174px';refresh();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
  function tap(e){if(!playing)return;e.preventDefault();const r=runner.getBoundingClientRect(),t=$('target').getBoundingClientRect();if(r.right>=t.left&&r.left<=t.right){height+=10;earned+=20;speed=Math.min(620,speed+22);money+=20;$('height').textContent=height;$('coins').textContent=money;dog.style.bottom=Math.min(innerHeight*.58,174+height*2.1)+'px';dog.classList.remove('bounce');void dog.offsetWidth;dog.classList.add('bounce');$('message').className='show';setTimeout(()=>$('message').className='',560);save()}else{gameOver()}}
  function gameOver(){playing=false;cancelAnimationFrame(raf);dog.className='fall';if(height>best)best=height;save();setTimeout(()=>{$('finalHeight').textContent=height;$('earned').textContent=earned;$('bestResult').textContent=best;$('resultDog').src=dogs[chosen].src;$('result').classList.remove('hidden');refresh()},1050)}
  function renderShop(){const list=$('shopList');list.innerHTML='';dogs.forEach((d,i)=>{const has=owned.includes(i),b=document.createElement('button');b.className='dogChoice '+(i===chosen?'selected ':'')+(has?'':'locked');b.innerHTML=`<img src="${d.src}" alt="${d.n}"><small>${has?d.n:'<span class="coinIcon">★</span>'+d.p}</small>`;b.onclick=()=>{if(has){chosen=i}else if(money>=d.p){money-=d.p;owned.push(i);chosen=i}else{alert('게임머니가 부족해!')}save();refresh();renderShop()};list.appendChild(b)})}
  $('startBtn').onclick=start;$('retryBtn').onclick=start;$('homeBtn').onclick=()=>{$('result').classList.add('hidden');$('start').classList.remove('hidden');refresh()};
  $('shopBtn').onclick=()=>{$('start').classList.add('hidden');$('shop').classList.remove('hidden');renderShop();refresh()};$('shopBack').onclick=()=>{$('shop').classList.add('hidden');$('start').classList.remove('hidden');refresh()};
  $('game').addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON')tap(e)},{passive:false});refresh();
})();
</script>
</body>
